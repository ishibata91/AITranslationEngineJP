<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>UI Mock: task-id</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, sans-serif;
      }

      body {
        margin: 0;
      }

      main {
        min-height: 100vh;
      }
    </style>
  </head>
  <body>
    <main data-ui-mock-root>
      <!-- task 固有の主要区画、主要操作、状態差分をここへ置く。 -->

      <section
        data-ui-mock-sample-data-root
        hidden
        aria-hidden="true"
      >
        <!--
          モックデータ置き場。
          大きい値や複数状態の値は task folder の mock-data/ に分離する。
          この範囲の値は状態表示確認用であり、frontend 実装へ移植しない。
          実装で使う初期値、fixture、test data、default state には使わない。
        -->
        <template data-ui-mock-sample-data>
          <!--
            task 固有のサンプル行、仮 ID、仮ファイル名、仮辞書名、
            仮エラー詳細、仮レスポンス値をここへ置く。
          -->
        </template>
      </section>
    </main>
  </body>
</html>
