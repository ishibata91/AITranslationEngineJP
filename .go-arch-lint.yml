version: 3
workdir: internal

components:
  bootstrap:
    in: bootstrap/**
  controller:
    in: controller/**
  usecase:
    in: usecase/**
  translationjobpolicy:
    in: usecase/translationjobpolicy/**
  service:
    in: service/**
  notification:
    in: notification/**
  # API test 専用ディレクトリ。
  # 公開 API / Wails controller 起点の system-level scenario test だけを置く場所。
  # production code を置いてはいけない。
  apitest:
    in: apitest/**
  repository:
    in: repository/**
  infra_ai:
    in: infra/ai/**
  infra_runtime:
    in: infra/runtime/**
  infra_sqlite:
    in: infra/sqlite/**
  # integration test 専用ディレクトリ。
  # 複数コンポーネントをまたぐ SQLite integration test だけを置く場所。
  # production code を置いてはいけない。
  integrationtest:
    in: integrationtest/**
  # 単語翻訳対象 REC の共通 config。外部 IO を持たない純粋な判定 package。
  # service と repository の両方から参照される共有 config として最下位に位置付ける。
  recclassification:
    in: recclassification/**

deps:
  bootstrap:
    deepScan: false
    mayDependOn:
      - controller
      - usecase
      - service
      - notification
      - repository
      - infra_ai
      - infra_runtime
  controller:
    mayDependOn:
      - usecase
  usecase:
    mayDependOn:
      - service
      - translationjobpolicy
      - notification
  service:
    deepScan: false
    mayDependOn:
      - repository
      - notification
      - recclassification
      # シナリオテストが処理対象一覧と実行対象の REC 集合一致を検証するために
      # 同一 SQLite を repository とサービス両方から読む経路だけ許可する。
      - infra_sqlite
  # API test 専用コンポーネント。
  # public seam から backend graph を観測するため、複数 backend component への依存をここだけに許可する。
  apitest:
    mayDependOn:
      - bootstrap
      - controller
      - usecase
      - service
      - notification
      - repository
      - infra_ai
      - infra_runtime
      - infra_sqlite
  repository:
    mayDependOn:
      - infra_runtime
      - infra_sqlite
      - recclassification
  infra_ai:
    mayDependOn:
      - infra_runtime
  infra_runtime:
    deepScan: false
    mayDependOn:
      - notification
  # integration test 専用コンポーネント。
  # infra_sqlite (dbinit) と repository の両方への依存をここだけに許可する。
  integrationtest:
    mayDependOn:
      - infra_sqlite
      - repository
allow:
  depOnAnyVendor: true
