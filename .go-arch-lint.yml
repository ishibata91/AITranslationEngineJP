version: 3
workdir: .

# architecture.md §4 の依存方向（import 方向）を固定する。
# deepScan は composition root での値受け渡し（bootstrap が store 値を engine.New へ渡す等）を
# 依存と誤帰属するため無効化し、import レベルで判定する。
allow:
  depOnAnyVendor: true
  deepScan: false

# Go module 外のディレクトリと、本骨格に属さない leftover を除外する。
exclude:
  - scripts
  - tmp
  - build
  - frontend
  - node_modules

components:
  # 製品本体の層（architecture.md §2・§3）。
  main:
    in: .
  bootstrap:
    in: internal/bootstrap
  api:
    in: internal/api
  engine:
    in: internal/engine
  provider:
    in: internal/provider
  store:
    in: internal/store
  # secret は store の子（残存の keyring secret store）。現状 import 元なし。
  secret:
    in: internal/store/secret
  # lexicon は感情辞書（NRC）の concrete アダプタ（os 読みを持つ）。bootstrap が new し
  # core/linefeatures.EmotionLexicon interface へ注入する。core は lexicon を import しない。
  lexicon:
    in: internal/lexicon
  model:
    in: internal/model
  migrations:
    in: db

  # core/* は副作用のない決定的な計算ロジック（functional core）。engine 等が一方向に import する。
  # 純粋ルールは os・provider・store・engine を import しない（IO は engine 側へ寄せる）。
  dictionary:
    in: internal/core/dictionary
  mention:
    in: internal/core/mention
  prompt:
    in: internal/core/prompt
  termderive:
    in: internal/core/termderive
  termusage:
    in: internal/core/termusage
  termxml:
    in: internal/core/termxml
  # runtimetag は本文中の実行時タグ（<Alias=...>）の退避・復元の純粋ルール。engine が一方向に import する。
  runtimetag:
    in: internal/core/runtimetag
  rolespeech:
    in: internal/core/rolespeech
  linefeatures:
    in: internal/core/linefeatures
  personatone:
    in: internal/core/personatone
  # tone は基底口調の分類器（純粋）。core 集積へ移設した。
  tone:
    in: internal/core/tone

  # harness は合成入力の統合非劣化テスト基盤（完了定義②）。テスト用の composition root の
  # ように層をまたいで配線するため、api・engine・store・provider への依存を明示的に許す。
  harness:
    in: internal/harness
  # goldcap は実データ golden 捕獲ツール（完了定義③）。harness を本番アダプタで駆動する。
  goldcap:
    in: cmd/goldcap
  # poc-tone は口調抽出の旧 PoC（stdlib のみ・自 module 非依存の独立 main）。
  poc-tone:
    in: cmd/poc-tone

deps:
  main:
    mayDependOn:
      - bootstrap
  bootstrap:
    mayDependOn:
      - api
      - engine
      - provider
      - store
      - lexicon
      - rolespeech
      # 一般語 stoplist（dictionary.ParseStoplist）の asset 読み込みと注入は composition root の責務。
      - dictionary
  api:
    mayDependOn:
      - model
      - provider
      - engine
      - dictionary
      - prompt
      - runtimetag
  engine:
    mayDependOn:
      - model
      - provider
      - tone
      - dictionary
      - mention
      - prompt
      - termxml
      - runtimetag
      - rolespeech
      - linefeatures
      - personatone
  store:
    mayDependOn:
      - model
      - migrations
  # core/* 内部の一方向依存（逆依存・循環なし）。
  prompt:
    mayDependOn:
      - provider
      - runtimetag
  termusage:
    mayDependOn:
      - termderive
  termxml:
    mayDependOn:
      - termderive
      - termusage
  linefeatures:
    mayDependOn:
      - tone
  personatone:
    mayDependOn:
      - tone
      - model
      - rolespeech
  harness:
    mayDependOn:
      - api
      - engine
      - provider
      - store
      - linefeatures
      - rolespeech
      # 合成 stoplist（dictionary.ParseStoplist）を組むテスト用 composition root の責務。
      - dictionary
      # RecordingProvider が退避プレースホルダを保持するモデルを模すため、runtimetag.Placeholders を使う。
      - runtimetag
  goldcap:
    mayDependOn:
      - api
      - engine
      - harness
      - lexicon
      - rolespeech
      # 実 stoplist（assets/stopwords-en.txt）を読み harness へ注入する責務。
      - dictionary
