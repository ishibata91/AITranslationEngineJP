version: 3
workdir: .

# architecture.md §4 の依存方向（import 方向）を固定する。
# deepScan は composition root での値受け渡し（bootstrap が store 値を engine.New へ渡す等）を
# 依存と誤帰属するため無効化し、import レベルで判定する。
allow:
  depOnAnyVendor: true
  deepScan: false

# Go module 外のディレクトリと、本骨格に属さない leftover を除外する。
exclude:
  - scripts
  - tmp
  - build
  - frontend
  - node_modules

components:
  # 製品本体の層（architecture.md §2・§3）。
  main:
    in: .
  bootstrap:
    in: internal/bootstrap
  api:
    in: internal/api
  engine:
    in: internal/engine
  # tone は engine の子パッケージ（基底口調の分類器）。engine だけが使う。
  tone:
    in: internal/engine/tone
  provider:
    in: internal/provider
  store:
    in: internal/store
  # secret は store の子（残存の keyring secret store）。現状 import 元なし。
  secret:
    in: internal/store/secret
  # lexicon は感情辞書（NRC）の concrete アダプタ。bootstrap が new し engine の
  # EmotionLexicon interface へ注入する。engine は lexicon を import しない。
  lexicon:
    in: internal/lexicon
  model:
    in: internal/model
  migrations:
    in: db
  # harness は合成入力の統合非劣化テスト基盤（完了定義②）。テスト用の composition root の
  # ように層をまたいで配線するため、api・engine・store・provider への依存を明示的に許す。
  harness:
    in: internal/harness
  # goldcap は実データ golden 捕獲ツール（完了定義③）。harness を本番アダプタで駆動する。
  goldcap:
    in: cmd/goldcap
  # poc-tone は口調抽出の旧 PoC（stdlib のみ・自 module 非依存の独立 main）。
  poc-tone:
    in: cmd/poc-tone

deps:
  main:
    mayDependOn:
      - bootstrap
  bootstrap:
    mayDependOn:
      - api
      - engine
      - provider
      - store
      - lexicon
  api:
    mayDependOn:
      - model
      - provider
      - engine
  engine:
    mayDependOn:
      - model
      - provider
      - tone
  store:
    mayDependOn:
      - model
      - migrations
  harness:
    mayDependOn:
      - api
      - engine
      - provider
      - store
  goldcap:
    mayDependOn:
      - api
      - engine
      - harness
      - lexicon
