      - CONTRACT-PGP-001
    broken_invariants:
      - public execution summary の promptDigest は raw prompt を出さずに provider prompt を識別する digest を返す。
    likely_causes:
      - PersonaGenerationProviderAdapter は actual prompt digest を計算するが、PersonaGenerationPhaseService の summary / command response は snapshot.digest を Execution.PromptDigest に再利用している。
    workflow_improvement_note: >
      redacted audit summary の digest field は shape だけでなく意味を focused test で固定する。
      target snapshot digest と prompt digest が別 field の場合、同じ値を入れていないことを
      backend service と frontend gateway contract の両方で確認する。
  - rejected_at: "2026-05-02T07:07:29Z"
    task_id: persona-generation-phase
    viewpoint: contract
    reviewer_agent: review_contract
    review_yaml_path: docs/exec-plans/active/persona-generation-phase/reviewback.contract.yaml
    review_status: issues_open
    must_fix_open: true
    max_level: major
    open_issue_ids:
      - CONTRACT-PGP-001
    broken_invariants:
      - public execution summary の promptDigest は raw prompt を出さずに provider prompt を識別する digest を返し、target snapshot digest と同じ意味の値を rejected command response で返さない。
    likely_causes:
      - buildExecutionSummary は aggregatePromptDigest に修正済みだが、rejectedCommand は Execution.PromptDigest に snapshot.digest を直接入れている。
      - usecase と Wails controller は rejected command result も public command response DTO へ写像するため、誤った意味の digest が public seam に残る。
    workflow_improvement_note: >
      prompt digest の focused test は success / summary だけでなく、rejected command response など
      public command response の全経路を対象にする。特に target snapshot digest と同名でない別 field は、
      field shape ではなく意味差を経路別に固定する。
