    broken_invariants:
      - Job Setup で設定した provider、model、execution mode は本文翻訳 provider 実行まで到達する。
      - Job Run は field 単位の訳文、出力ステータス、保護要素検証結果を実 DTO から表示できる。
    likely_causes:
      - paid API 回避条件が service の runtime guard になり、non-fake provider を provider_failure にしている。
