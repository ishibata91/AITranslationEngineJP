    open_issue_ids:
      - BEHAVIOR-BTP-001
      - BEHAVIOR-BTP-002
      - BEHAVIOR-BTP-003
      - BEHAVIOR-BTP-004
    broken_invariants:
      - pause、resume、retry、cancel は public seam 実行後の summary 再読込でも同じ state と progress を返す。
      - Canceled、Completed、Failed 後の provider response、validation result、save request は field result と phase state を後書きしない。
      - 通常の Start / retry は fake provider から field result 保存、phase 完了、job 完了、output readiness まで到達できる。
      - Job Run は field 単位の訳文、出力ステータス、保護要素検証結果を表示できる。
    likely_causes:
      - phase 操作が `stubbedExistingRunCommand` の返却 payload 実装で止まり、DB 更新 transaction を持っていない。
      - field result persistence の mutation guard が job / phase terminal state と late response を検査していない。
      - provider adapter と field result persistence が public phase command へ接続されていない。
      - frontend public DTO が field result item 配列を持たず、UI が未契約 field の fallback 探索に依存している。
    workflow_improvement_note: >
      body phase の acceptance test は public seam 起点で、command response だけでなく直後の summary 再読込、
      row count、phase state、job state、output readiness を同時に確認する必要がある。
      provider / persistence の lower-level test だけでは、Job Run から実行できる本文翻訳挙動を証明できない。
