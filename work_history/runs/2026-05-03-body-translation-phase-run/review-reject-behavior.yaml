    workflow_improvement_note: >
      fix 後の再レビューでは fake provider の通過だけでなく、Job Setup supported provider 名を持つ test-safe transport fixture を
      public Start / Retry から通す必要がある。field result 表示は frontend optional DTO ではなく backend public DTO から
      field item が届くことを受け入れ観点に含める必要がある。
