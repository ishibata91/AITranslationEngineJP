    broken_invariants:
      - >
        public command rejection は error kind、retryable flag、phase state、
        output readiness、redacted error summary を frontend caller が分岐できる形で返す。
    likely_causes:
      - >
        business rejection を Go error として Wails boundary に返しているため、
        Wails dispatcher の error 応答処理で command result が破棄される。
      - >
        frontend usecase は command Promise の reject 経路で structured command payload を受ける契約を持たず、
        fallback error message だけを state に反映している。
    workflow_improvement_note: >
      integration handoff では、Go controller の error path だけでなく、
      Wails runtime が JavaScript 側へ渡す result / error envelope まで contract freeze の確認対象に含める。
