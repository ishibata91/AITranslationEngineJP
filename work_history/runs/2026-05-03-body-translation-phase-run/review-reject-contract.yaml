    broken_invariants:
      - >
        backend usecase の summary / command DTO は Wails controller と frontend gateway DTO へ
        lossless に写像される。
      - >
        public command rejection は error kind、retryable flag、phase state、
        output readiness を caller が分岐できる形で返す。
    likely_causes:
      - >
        Wails / frontend contract が usecase contract の全 field ではなく、
        縮約された表示用 summary に合わせて定義されている可能性がある。
      - >
        Cancel controller method が既存のゼロ値 error response pattern に寄り、
        usecase が error と同時に返す command result を DTO mapping していない可能性がある。
    workflow_improvement_note: >
      integration handoff では、usecase result field と Wails / frontend DTO field の対応表を
      contract freeze 完了条件に含める。command method は success path だけでなく、
      rejected path の payload 維持も controller unit test と frontend gateway contract test で固定する。
