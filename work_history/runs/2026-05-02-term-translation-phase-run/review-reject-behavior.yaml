    - >
      save_failed の rollback 確認と snapshot source の固定確認は別観点として分ける必要がある。
      partial job dictionary を残さないことだけでは、phase 開始時 snapshot の保持を証明できない。
    - >
      状態拒否と public error kind の修正は解決済みとして、次回差し戻しでは snapshot persistence 経路だけに検証を絞る。
  issue_refs:
