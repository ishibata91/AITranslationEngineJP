reject_log_version: 1
entries:
  - task_id: term-translation-phase
    reviewer_agent: review_trust_boundary
    review_yaml_path: docs/exec-plans/active/term-translation-phase/reviewback.trust-boundary.yaml
    review_status: issues_open
    must_fix_open: true
    max_level: blocker
    hard_gate: true
    rejected_at: "2026-05-02"
    issue_ids:
      - TTP-TRUST-001
      - TTP-TRUST-002
    rejection_reason: >-
      secret / credential reference の信頼境界違反が残っている。
      権限・信頼境界観点は hard gate のため、最終検証通過や他観点の評価では相殺しない。
    broken_invariants:
      - >-
        API key は URL query に出さない。
      - >-
        credential_ref は外部 provider の APIKey として扱わない。
      - >-
        UI / DTO に出せる参照値と backend 内部の secret value を混同しない。
    cause_candidates:
      - >-
        Gemini provider request の既存 query key 実装を term translation path でも再利用した。
      - >-
        term phase provider execution に secret store 解決境界が wiring されていない。
      - >-
        fake secret store assertion が completion evidence に残っておらず、credential_ref と secret value の取り違えを検出できなかった。
    workflow_improvement_candidates:
      - >-
        provider handoff の completion signal に「URL に secret が含まれない request capture」を明示する。
      - >-
        secret を扱う phase handoff では fake secret store と fake transport の両方を使う境界テストを必須証跡にする。
      - >-
        credential_ref を DTO 表示値、secret value を provider auth 値として別名で固定し、handoff 間で同名扱いにしない。
  - task_id: term-translation-phase
    reviewer_agent: review_trust_boundary
    review_yaml_path: docs/exec-plans/active/term-translation-phase/reviewback.trust-boundary.yaml
    review_status: stopped
    must_fix_open: true
    max_level: blocker
    hard_gate: true
    rejected_at: "2026-05-02"
    issue_ids:
      - TTP-TRUST-003
    rejection_reason: >-
      指定された `python3 scripts/harness/run.py --suite all` は Sonar 外部送信を含むため、
      require_escalated 実行が拒否された。
      権限・信頼境界観点は hard gate のため、
      execution、system-test、coverage、Sonar issue 0 の未確認を他観点の成功で相殺しない。
    broken_invariants:
      - >-
        hard gate の完了には、指定された最終検証結果が確認可能であること。
      - >-
        Sonar security 0、reliability 0、maintainability HIGH 0 を未確認のまま passed にしないこと。
      - >-
        外部送信を伴う検証を追加承認なしに迂回実行しないこと。
    cause_candidates:
      - >-
        `all` suite が `check_execution.py` と `check_coverage.py` を通じて Sonar scan を実行する。
      - >-
        レビュー agent の権限境界では、外部 Sonar service への repo analysis data 送信が追加承認なしに許可されなかった。
      - >-
        最終検証要件が local harness と外部 Sonar scan を同一 `all` suite に束ねている。
    workflow_improvement_candidates:
      - >-
        外部送信を伴う Sonar 検証は、レビュー agent 起動前に implement_lane 側の完了根拠として固定する。
      - >-
        local execution / system-test / coverage と Sonar issue gate を別 completion evidence に分ける。
      - >-
        hard gate reviewer へ渡す入力に、Sonar security / reliability / maintainability HIGH の取得結果と取得日時を含める。
