- task_id: term-translation-phase
  reviewer_agent: review_state_invariant
  review_yaml_path: docs/exec-plans/active/term-translation-phase/reviewback.state-invariant.yaml
  review_status: issues_open
  must_fix_open: true
  max_level: major
  reject_reason: >
    状態・データ不変条件の未解決指摘がある。provider 途中失敗時の辞書 partial state と、
    後続 phase guard の candidate coverage 判定が未解決である。
  issues:
    - id: SI-001
      level: major
      title: provider 途中失敗で同一 attempt の辞書 partial state が commit される
      broken_invariant: failed / retryable attempt は新規 partial dictionary state を残さない。
      cause_candidate: transaction rollback 条件と recoverable failure command response が分離されていない。
    - id: SI-002
      level: major
      title: 後続 phase guard が candidate coverage ではなく job 辞書全件数で成立する
      broken_invariant: 後続 phase readiness は現在候補語の辞書参照成立で判定する。
      cause_candidate: readiness 側だけ candidate-specific confirmedCount ではなく len(confirmedTerms) を使っている。
  workflow_improvement:
    - 複数対象語の途中失敗 fixture を scenario/API test に含める。
    - unmatchedCount と canStartNextPhase の整合を review 前 gate で確認する。
    - completed run でも辞書参照不能なら後続 phase 不可になる fixture を追加する。

- task_id: term-translation-phase
  reviewer_agent: review_state_invariant
  review_yaml_path: docs/exec-plans/active/term-translation-phase/reviewback.state-invariant.yaml
  review_status: issues_open
  must_fix_open: true
  max_level: major
  reject_reason: >
    状態・データ不変条件の未解決指摘がある。task 正本は job を Running のまま維持し、
    単語翻訳フェーズ固有の完了、中断、回復可能失敗、再実行準備を phase state で
    区別すると固定している。しかし PausePhase と markPhaseRunFailure は
    `TRANSLATION_JOB.state` も paused / recoverable_failed / failed へ更新する。
  issues:
    - id: SI-003
      level: major
      title: job state が phase state と二重に中断・失敗状態へ遷移する
      broken_invariant: job は Running のまま、term phase の状態差分は JOB_PHASE_RUN.state で区別する。
      cause_candidate: PausePhase と markPhaseRunFailure が phase run state と translation job state を同じ状態語彙で結合している。
  validation:
    focused_command: GOCACHE=/private/tmp/aitranslationenginejp-go-cache go test ./internal/service -run 'TermTranslationPhaseService.*(Pause|Retry|SaveFailed|ReadNext|Snapshot|Resume)'
    focused_result: passed
    final_harness: not_executed
    final_harness_reason: require_escalated execution was rejected because harness all may submit repository-derived data and coverage to external Sonar service.
  workflow_improvement:
    - phase-local state と job aggregate state の期待値を Start / Pause / Resume / Retry fixture に分けて確認する。
    - recoverable failure と failed の retryability を phase state、latest error、job state の 3 点で同時検証する。
    - review 依頼時に Sonar 外部送信を含む harness 実行可否を明示する。
