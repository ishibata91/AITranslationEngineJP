id: frontend-fake-api-review-foundation
title: フロントエンド fakeAPI レビュー基盤
usecase: frontend-fake-api-review-foundation
flow_stage: foundation
related_screens: []
goal: 起動モードで frontend の API 接続先を fakeAPI に切り替え、実フロントのままレビュー用状態を再現できるようにする。
inputs:
  - frontend API contract
  - fakeAPI 起動モード
  - review state mock data
outputs:
  - frontend fakeAPI 起動モード
  - fakeAPI DI 境界
  - review state mock data
  - 本番 API 混入防止条件
  - 実画面レビュー用状態 variant 一覧
preconditions:
  - 基盤データ管理が成立している
completion_criteria:
  - 起動モードで frontend の API 接続先を fakeAPI に切り替えられる
  - 本番起動では fakeAPI が選ばれない
  - 空状態、読み込み中、成功状態、進行中状態、失敗状態、設定不足状態を fakeAPI で再現できる
  - 画面固有の mock data を usecase task 側で追加できる
  - 実フロントを `agent-browser` で開き、状態 variant ごとの表示を確認できる
  - fakeAPI と mock data が本番 API、永続化、production default state に混入しない
  - fakeAPI 起動モードが壊れていないことを局所テストで確認できる
  - coverage harness では fakeAPI 基盤を数値判定の例外として扱い、例外理由と局所テスト結果を記録できる
depends_on:
  - foundation-data-management
related_exec_plans: []
related_tests: []
manual_check_steps:
  - fakeAPI 起動モードでアプリを起動する
  - fakeAPI 起動モードの局所テストを実行する
  - 実画面で状態 variant を切り替える
  - 空状態、成功状態、進行中状態、失敗状態、設定不足状態を確認する
  - 本番起動で fakeAPI が選ばれないことを確認する
