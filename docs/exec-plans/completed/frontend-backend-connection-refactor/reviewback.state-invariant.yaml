state_invariant_review:
  gate_result: "pass"
  maintained_invariants:
    - "Wails bridge 応答は gateway 内で runtime shape 検証を通過した場合だけ application contract へ渡る。"
    - "runtime shape 検証失敗時は user-facing message と internal diagnostic を分け、不正応答値を画面状態へ反映しない。"
    - "provider settings の providerId、credentialState、validationState、savedState は既知値だけが gateway から返る。"
    - "term translation の summary、command、AI settings、next phase readiness は必須 field と optional field の shape を検証してから返る。"
    - "translation job management の list、detail、stop、resume、delete 応答は job state、progress、operation availability、action result の shape を検証してから返る。"
    - "body translation の summary、command、AI settings、output readiness は phase base、progress、execution、resultSummary、outputReadiness の shape を検証してから返る。"
    - "screen controller factory は gateway DTO 型を参照せず、controller singleton と gateway 接続状態を既存どおり保持する。"
    - "fake API ではない system test が production factory から AppController binding までの接続状態を固定する。"
  broken_invariants: []
  cause_candidates: []
  local_fix_assessment: "未解決指摘なし。追加修正は不要である。将来 runtime shape 検証対象を広げる場合は、各 gateway の validator と対応 gateway test の局所追加で閉じる見込みである。backend の同時実行制御、永続化順序、repository 更新を変更する場合は service / repository の状態遷移不変条件として別途確認が必要である。"
  invariant_test_viewpoints:
    - "provider settings gateway は invalid providerId や未知 savedState を受けた時に GatewayResponseShapeError を返し、画面状態へ反映しないこと。"
