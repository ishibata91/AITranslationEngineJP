    - "translation job management gateway は jobs、detail、action response の型違いを受けた時に GatewayResponseShapeError を返すこと。"
    - "body translation gateway は outputReadiness、resultSummary、execution の型違いを受けた時に GatewayResponseShapeError を返すこと。"
    - "shape 検証失敗時の diagnostic に credentialInput、apiKey、raw secret が含まれないこと。"
    - "system test は fakeApi query を使わず provider settings 画面を開き、Gateway 接続準備済みと AppController Health ok を確認すること。"
