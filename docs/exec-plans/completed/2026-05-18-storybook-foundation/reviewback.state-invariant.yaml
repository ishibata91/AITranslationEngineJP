assessment:
  invariant_maintenance: "維持されている。Storybook fixture は固定 props と無処理 callback だけで構成され、backend state、Wails runtime、AI provider、secret store、DB、filesystem business flow を状態源として扱っていない。Storybook import 境界は story と fixture を許可し、production code から Storybook package への import を禁止する判定と単体テストで確認されている。task-local の confirmed は Playwright 証跡と storybook-review.md の確認結果に対応している。破られた不変条件は確認されなかった。原因候補はなし。局所修正評価は不要である。"
  evidence_sufficiency: "十分。diff 由来の story、fixture、lint rule、lint rule test、task-local review artifact を確認し、呼び出し元の build、lint、frontend-local、browser confirmation の pass 証跡をレビュー入力として扱った。Sonar server issue gate は未実行のため未確認範囲に残す。"

