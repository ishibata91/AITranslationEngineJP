  invariant_test_viewpoints:
    - "missing phase でも gateway が 1 回呼ばれ、backend が not_required と単一モデルを返すと返却 modelId が選択されることを確認済み。"
    - "provider 変更後の遅延 success 応答と遅延 failed 応答が、現在 providerModelLists と model を巻き戻さないことを既存テストで確認済み。"
