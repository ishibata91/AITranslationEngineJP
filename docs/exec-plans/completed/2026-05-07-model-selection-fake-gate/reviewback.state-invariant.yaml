    - "gateway 応答は、最新 phase selection の provider と最新 providerModelLists の requestToken が応答と一致する場合だけ状態へ反映される。"
    - "credential_missing を含む利用不可 status では、phaseRuntimeSelections.model は空文字へ戻る。"
    - "利用可能 status で現在 model が返却 models に存在しない時だけ、単一 models の modelId を fallback として選ぶ。"
