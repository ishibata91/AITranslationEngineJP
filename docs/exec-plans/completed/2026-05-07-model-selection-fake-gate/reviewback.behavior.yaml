assessment:
  behavior_match: "一致。refreshPhaseModels は credentialStatus が missing の phase でも gateway 呼び出しへ進み、backend 応答が usable な単一モデル一覧であれば返却 modelId を選択状態へ反映する。backend 応答が usable ではない場合は既存の失敗状態反映へ進む。frontend に fake provider ID や fake-model 固有分岐は追加されていない。"
  evidence_sufficiency: "十分。人間観測、原因箇所シーケンス図、修正入力、実装結果、単体テスト更新結果、対象 diff、実コードを照合した。呼び出し元が提示した frontend 対象テストと frontend-local の通過証跡をレビュー入力として扱った。レビュー agent の制約に従いハーネス再実行はしていない。"
  broken_invariants: []
  cause_candidates: []
  local_fix_assessment: "未解決の挙動正しさ指摘はない。修正は refreshPhaseModels の missing credential 事前 return 撤去と、既存の gateway 応答反映経路を使う単一モデル選択に閉じている。"
  invariant_test_viewpoints:
    - "credentialStatus が missing の phase でも refreshPhaseModels が gateway を 1 回呼ぶ。"
    - "gateway へ渡す request は phaseId、provider、credentialStatus を保持する。"
    - "backend が not_required かつ success の単一モデル一覧を返すと、返却 modelId が選択状態へ入る。"
    - "単一モデル選択は fake-model 固定文字列ではなく返却 modelId を使う。"

