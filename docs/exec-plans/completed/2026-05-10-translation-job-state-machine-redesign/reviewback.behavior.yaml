issues:
  - id: "behavior-001"
    level: "major"
    title: "本文翻訳 read model が recoverable_failed の resume を許可表示する"
    problem: "初回レビュー時は、本文翻訳 phase の read model が recoverable_failed の phase run に対して CanResume を true にしていた。再実行 3 時点では、recoverable_failed は CanResume=false、CanRetry=true になっている。"
    reason: "再実行 3 時点の実コードでは、本文翻訳 read model、共通 policy、公開 API 経路が recoverable_failed の resume を拒否し、retry だけを許可する。"
    violated_condition: "resume は paused の JOB_PHASE_RUN.state だけに許可し、RecoverableFailed の resume は拒否する。"
    cause_candidate: "修正後の internal/service/body_translation_phase_service.go:1194 は paused だけを resume 可能にし、internal/service/body_translation_phase_service.go:1200 は recoverable_failed だけを retry 可能にしている。internal/usecase/translationjobpolicy/policy.go:77 も同じ条件を使う。"
    evidence:
      - path: "internal/service/body_translation_phase_service.go"
        line: 1194
        excerpt: "本文翻訳 phase の buildActionEnablement は state が paused でない場合に CanResume を true にしない。"
      - path: "internal/service/body_translation_phase_service.go"
        line: 1200
        excerpt: "本文翻訳 phase の buildActionEnablement は state が recoverable_failed の場合だけ CanRetry を true にする。"
      - path: "internal/usecase/translationjobpolicy/policy.go"
        line: 77
        excerpt: "共通 policy は OperationResume を PhaseStatePaused だけに許可し、OperationRetry を PhaseStateRecoverableFailed だけに許可する。"
      - path: "internal/apitest/body_translation_recovery_terminal_readiness_test.go"
        line: 192
        excerpt: "公開 API 経路で RecoverableFailed resume の拒否と非 mutation を確認している。"
    local_fix_assessment: "resolved。本文翻訳 read model と共通 policy の局所修正で閉じている。"
    additional_check_scope: "none。再実行 3 対象内で read model、policy、公開 API 経路を確認した。"
    fix_considerations: "解決済みである。非 terminal job の running pause、paused resume/cancel、recoverable_failed retry は維持されている。"
    verification: "final-validation で backend-local と coverage は pass と記録されている。"
    fix_required: true
    status: "resolved"

  - id: "behavior-002"
    level: "major"
    title: "単語翻訳 Service の pause guard が terminal job を拒否しない"
    problem: "初回レビュー時は、単語翻訳 phase の PausePhase が terminal job を拒否せず、run が running なら phase run と job を更新できた。再実行 3 時点では、terminal job 判定が phase state 判定と update より前に置かれている。"
    reason: "再実行 3 時点の実コードでは、単語翻訳 Service の pause 実処理 guard が terminal job を mutation 前に拒否する。"
    violated_condition: "terminal job では状態変更操作を拒否する。Service は実処理側の guard を共通操作規則と同じ結果へ揃える。"
    cause_candidate: "修正後の internal/service/term_translation_phase_service.go:407 は terminal job を先に判定し、internal/service/term_translation_phase_service.go:428 以降の update へ進ませない。"
    evidence:
      - path: "internal/service/term_translation_phase_service.go"
        line: 407
        excerpt: "PausePhase は job と run を読み込んだ後、run state 判定と update より前に terminal job を拒否する。"
      - path: "internal/usecase/translationjobpolicy/policy.go"
        line: 69
        excerpt: "共通 policy は terminal job を状態変更操作の前に拒否する。"
    local_fix_assessment: "resolved。単語翻訳 Service の局所修正で閉じている。"
    additional_check_scope: "none。再実行 3 対象内で Service guard と共通 policy の該当経路を確認した。"
    fix_considerations: "解決済みである。"
    verification: "final-validation で backend-local と coverage は pass と記録されている。"
    fix_required: true
    status: "resolved"

  - id: "behavior-003"
    level: "major"
    title: "terminal job の read model が操作可能表示を返す"
    problem: "前回レビュー時は、本文翻訳と単語翻訳の read model が terminal job でも phase run state だけを見て CanPause、CanResume、CanRetry、CanCancel を true にできた。再実行 3 時点では、本文翻訳 phase と単語翻訳 phase の terminal job summary は状態変更操作の可否を false にする。"
    reason: "本文翻訳 phase の buildActionEnablement は terminal job 判定で pause、resume、retry、cancel を有効化せずに返る。単語翻訳 phase の ReadSummary は isTerminalJob を canPause、canResume、canRetry の前提にしている。Service 実処理 guard も terminal job を mutation 前または execution 前に拒否するため、read model 表示値と実処理 guard の矛盾は解消している。"
    violated_condition: "terminal job では状態変更操作を拒否する。Service は read model の操作可否と実処理側 guard を同じ規則へ揃える。"
    cause_candidate: "修正後の internal/service/body_translation_phase_service.go:1179 は terminal job の場合に blocked reason を設定して return する。修正後の internal/service/term_translation_phase_service.go:349 は terminal job 判定を操作可否の前提に入れている。"
    evidence:
