      - path: "internal/service/term_translation_phase_service.go"
        line: 407
        excerpt: "単語翻訳 Service pause guard は terminal job を update 前に拒否する。"
      - path: "internal/service/term_translation_phase_service.go"
        line: 600
        excerpt: "単語翻訳 Service resume/retry guard は terminal job を execution 前に拒否する。"
      - path: "internal/service/body_translation_phase_service_test.go"
        line: 839
        excerpt: "本文翻訳 summary test は terminal job で状態変更操作が false になることを確認する。"
      - path: "internal/service/term_translation_phase_service_test.go"
