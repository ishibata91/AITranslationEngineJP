issues:
  - id: "state-invariant-001"
    level: "major"
    title: "body と persona の状態変更 guard が永続更新と原子的でない"
    problem: "初回レビュー時点では、body phase と persona phase の状態変更が transaction 内で job state と phase state を再確認していなかった。"
    reason: "backend-review-fix-result.md と backend-validation-fix-result.md の修正後、本文翻訳 phase と NPC ペルソナ生成 phase は transaction 内で現在 job と現在 phase run を再取得し、terminal job と required state を再検証してから UpdateJobPhaseRunWhenState を呼ぶ実装になった。"
    violated_condition: "terminal job は状態変更操作を拒否する。同じ JOB_PHASE_RUN 継続時も、resume は paused、retry は recoverable_failed、cancel は paused の現在状態だけを更新する。"
    cause_candidate: "解決済み。internal/service/body_translation_phase_service.go:1373 から transaction 内再取得と再検証を行い、internal/service/body_translation_phase_service.go:1389 で UpdateJobPhaseRunWhenState を使う。internal/service/persona_generation_phase_service.go:752 の helper が同じ処理を行い、internal/service/persona_generation_phase_service.go:786 で UpdateJobPhaseRunWhenState を使う。"
    evidence:
      - path: "internal/service/body_translation_phase_service.go"
        line: 1373
        excerpt: "transaction 内で job と body phase run を再取得している。"
      - path: "internal/service/body_translation_phase_service.go"
        line: 1389
        excerpt: "requiredState を expectedState として UpdateJobPhaseRunWhenState を呼んでいる。"
      - path: "internal/service/persona_generation_phase_service.go"
        line: 752
        excerpt: "transaction 内 helper が job と persona phase run を再取得している。"
      - path: "internal/service/persona_generation_phase_service.go"
        line: 786
        excerpt: "requiredState を expectedState として UpdateJobPhaseRunWhenState を呼んでいる。"
    local_fix_assessment: "resolved"
    additional_check_scope: "追加の修正必須確認はない。残留リスクは unchecked_scope に記録した。"
    fix_considerations: "今後の変更では、transaction 内再確認、同じ phase run id の継続、required state 条件付き更新、terminal job 非変更を崩さないことが重要である。"
    verification: "final-validation.md に backend-local と coverage の pass が記録されている。対象テストで同じ phase run 継続、terminal job 非変更、UpdateJobPhaseRunWhenState の required state 不一致非更新を確認した。"
    fix_required: true
    status: "resolved"
  - id: "state-invariant-002"
    level: "major"
    title: "単語翻訳 resume と retry が条件付き状態更新を使っていない"
    problem: "前回レビュー時点では、単語翻訳 phase の resume と retry が、transaction 内で事前検証した phase run を running に戻す時、UpdateJobPhaseRunWhenState ではなく UpdateJobPhaseRun を呼んでいた。"
    reason: "backend-review-fix3-result.md の修正後、resume は expected state paused、retry は expected state recoverable_failed を UpdateJobPhaseRunWhenState に渡す実装になった。expected state 不一致相当の repository.ErrConflict では provider request に進まず、phase run も running へ更新されない。"
    violated_condition: "resume は paused の現在状態だけを running に更新する。retry は recoverable_failed の現在状態だけを running に更新する。どちらも同じ JOB_PHASE_RUN を required state 条件付きで更新する。"
    cause_candidate: "解決済み。internal/service/term_translation_phase_service.go:1113 の resumeExecutionPlanRun が resume と retry の expected state を分け、internal/service/term_translation_phase_service.go:1139 の updateExecutionPlanRunState が UpdateJobPhaseRunWhenState を呼ぶ。"
    evidence:
      - path: "internal/service/term_translation_phase_service.go"
        line: 1121
        excerpt: "resume は termTranslationPhaseStatePaused を expectedState として渡している。"
      - path: "internal/service/term_translation_phase_service.go"
        line: 1127
        excerpt: "retry は termTranslationPhaseStateRecoverableFail を expectedState として渡している。"
      - path: "internal/service/term_translation_phase_service.go"
        line: 1145
        excerpt: "UpdateJobPhaseRunWhenState で expectedState と running 更新 draft を渡している。"
      - path: "internal/service/term_translation_phase_service_test.go"
        line: 1058
        excerpt: "resume 成功時に expected state paused と同じ phase run id を検証している。"
      - path: "internal/service/term_translation_phase_service_test.go"
        line: 1089
        excerpt: "resume と retry の conflict で provider request が発生せず、phase run が running にならないことを検証している。"
      - path: "internal/service/term_translation_phase_service_test.go"
        line: 763
        excerpt: "retry 成功時に expected state recoverable_failed を検証している。"
    local_fix_assessment: "resolved"
    additional_check_scope: "追加の修正必須確認はない。残留リスクは unchecked_scope に記録した。"
    fix_considerations: "今後の変更では、terminal job 拒否、phase run id 一致、paused resume、recoverable_failed retry、同じ JOB_PHASE_RUN 継続、runtime snapshot 更新順序を崩さないことが重要である。"
    verification: "final-validation.md に backend-local と coverage の pass が記録されている。単語翻訳 phase の resume と retry が required state を expected state として条件付き更新すること、required state 不一致時に ErrConflict 相当で非更新になることを対象テストで確認した。"
    fix_required: true
    status: "resolved"
