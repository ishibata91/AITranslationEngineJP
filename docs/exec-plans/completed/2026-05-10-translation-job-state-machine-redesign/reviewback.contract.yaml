assessment:
  compatibility: "互換性は維持されている。再実行 3 の対象差分では、単語翻訳 phase の resume は `paused`、retry は `recoverable_failed` を expected state として `UpdateJobPhaseRunWhenState` に渡す。`RecoverableFailed` の resume 拒否と retry 許可は、共通 policy、単語翻訳 summary、本文翻訳 API test の公開結果と一致している。Wails DTO の field 名、JSON 名、nullable 条件、DB schema、repository 永続化型は増減していない。`translationjobpolicy.Result`、rule 名、判定履歴は repository、DB schema、Wails DTO へ出ていない。"
  evidence_sufficiency: "十分。`review-rerun3-input.md`、`backend-review-fix3-result.md`、`final-validation.md`、対象変更ファイル、UseCase policy 呼び出し、Service の条件付き更新、Wails DTO 変換、backend API test、backend unit test を確認した。system test は未実行だが、今回の契約判定は backend public seam、DTO 型、repository 型、静的差分で判定可能である。"
  broken_invariants: "なし。既存 DTO field の保持、公開 command response 形の保持、DB schema 非変更、policy 型非公開、resume は `paused` だけ許可、retry は `recoverable_failed` だけ許可、単語翻訳 resume / retry の条件付き同一 phase run 更新を満たしている。"
  cause_candidates: "未解決 issue がないため該当なし。再実行 3 の修正は `TermTranslationPhaseService.resumeExecutionPlanRun` と `updateExecutionPlanRunState` の expected state 引数追加に閉じている。"
  local_fix_assessment: "追加修正は不要。再実行 3 の修正は単語翻訳 phase の running 昇格条件を既存 repository method に渡す局所変更で、公開 DTO 形、Wails controller、永続化 schema、policy 保存境界へ波及していない。"
  invariant_test_perspective: "既存 field の JSON 名が変わらないこと、`RecoverableFailed` で resume が拒否され retry が許可されること、resume 成功時に expected state `paused` が使われること、retry 成功時に expected state `recoverable_failed` が使われること、expected state 不一致時に provider request が発生しないこと、policy 型や rule 名が永続化されないことをテスト観点として確認済み。"

