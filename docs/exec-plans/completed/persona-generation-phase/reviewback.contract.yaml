  - >
    rejected StartPersonaGenerationPhase response が Wails runtime 上で JS 側へ result として届くかは
    runtime 実装に依存する。ただし Go controller / usecase の public seam は result を構築しており、
    contract review では public method response として扱う。
  - >
    raw prompt、provider raw request / response、secret、API key の public DTO field は確認範囲では見つからない。
    debug log の redaction 正しさは trust-boundary 観点で扱う。
