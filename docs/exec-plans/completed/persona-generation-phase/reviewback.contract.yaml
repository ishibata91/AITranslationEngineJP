issues:
  - id: CONTRACT-PGP-001
    level: major
    title: rejected command response の promptDigest が target snapshot digest を返していた
    problem: >
      修正前の `StartPersonaGenerationPhase` rejected command response は public command response contract の
      `execution.promptDigest` に target snapshot 用の `snapshot.digest` を入れていた。
      最新実装では `service.aggregatePromptDigest(run, snapshot)` に変更済みである。
    reason: >
      `targetSummary.targetSnapshotDigest` と `execution.promptDigest` は別 field として frozen public seam に
      定義されている。最新実装では execution run がない rejected response の prompt digest は空文字になり、
      target snapshot digest を prompt digest の代替値として公開しない。
      consumer は target snapshot digest と prompt digest の意味差を維持できる。
    violated_condition: >
      public execution summary の `promptDigest` は raw prompt を出さずに provider prompt を識別する
      digest を返す。target snapshot digest は target snapshot 用 field として別に返す。
    cause_candidate: >
      修正前は `rejectedCommand` が `buildExecutionSummary` と別経路で `Execution.PromptDigest` を
      直接設定していた。最新実装では同じ aggregate helper を呼ぶため、原因経路は解消済みである。
    evidence:
      - path: docs/exec-plans/active/persona-generation-phase/implementation-scope.md
        line: 78
        excerpt: DTO は target snapshot digest と prompt digest を別 field として持つ。
      - path: internal/service/persona_generation_phase_service.go
        line: 338
        excerpt: StartPhase は start rejection 時に rejectedCommand の response と error を返す。
      - path: internal/service/persona_generation_phase_service.go
        line: 1029
        excerpt: rejectedCommand の Execution.PromptDigest に service.aggregatePromptDigest(run, snapshot) を設定している。
      - path: internal/service/persona_generation_phase_service.go
        line: 1906
        excerpt: aggregatePromptDigest は execution run がない場合に空文字を返す。
      - path: internal/usecase/persona_generation_phase_contract.go
        line: 212
        excerpt: PersonaGenerationPhaseCommandResult は Execution summary を public command response に含める。
      - path: internal/controller/wails/persona_generation_phase_controller.go
        line: 213
        excerpt: usecase error 時も command response DTO を作って返す。
      - path: internal/service/persona_generation_phase_service_test.go
        line: 303
        excerpt: 追加 focused test は rejected command の prompt digest が空文字で target snapshot digest と同値にならないことを確認している。
    local_fix_assessment: >
      service-rejected-command-mapping の局所修正で解決済みである。DTO shape、field 名、Wails binding は維持されている。
    additional_check_scope: none。StartPhase rejection path の focused test と public seam 読み取りで解決確認済みである。
    fix_considerations: >
      raw prompt、provider raw request / response、secret、API key は引き続き public DTO に出さない。
      provider prompt が存在しない rejected response では、target snapshot digest を prompt digest の代替値にしない。
    verification: >
      StartPhase rejection の focused test で `execution.promptDigest` が `targetSummary.targetSnapshotDigest` と
      同じ値にならず、provider prompt 未作成時は空文字になることを確認している。
      service focused test、backend-local、all suite は implement_lane 提供証跡で pass している。
    fix_required: true
    status: resolved

