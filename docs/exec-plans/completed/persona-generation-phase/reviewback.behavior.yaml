issues:
  - id: BEHAVIOR-PGP-001
    level: major
    title: missing persona が残っても body readiness が true になる
    problem: >
      前回は `ReadBodyReadiness` が Completed run で `PHASE_RUN_PERSONA` が 1 件以上あれば
      `Ready: true` を返し、target count より persona link が少ない snapshot を許容していた。
    reason: >
      最新実装では targetCount > 0 で missingCount > 0 の場合に `Ready: false`、
      `body_readiness_blocked`、missing count 付き input summary を返すため、SCN-PGP-006 の条件に一致する。
    violated_condition: >
      persona phase Completed かつ snapshot 参照成立時だけ body readiness が true になる。
      missing count が残る snapshot は body readiness false と開始不可理由を返す。
    cause_candidate: >
      `ReadBodyReadiness` が `snapshot.targetCount - len(phaseRunPersonas)` を readiness gate に使っていなかった。
      最新実装では missingCount gate が追加されている。
    evidence:
      - path: internal/service/persona_generation_phase_service.go
        line: 535
        excerpt: missingCount を targetCount と persona link 件数の差として計算する。
      - path: internal/service/persona_generation_phase_service.go
        line: 553
        excerpt: missingCount > 0 では Ready false と body_readiness_blocked を返す。
      - path: internal/service/persona_generation_phase_service.go
        line: 571
        excerpt: missingCount が 0 の時だけ Ready true を返す。
      - path: internal/service/persona_generation_phase_service_test.go
        line: 271
        excerpt: targetCount 2 / persona link 1 で readiness blocked と missingCount 1 を期待する。
    local_fix_assessment: resolved-local
    additional_check_scope: none。focused test と受領済み backend-local / all harness pass で確認済み。
    fix_considerations: target count 0 の empty completed は Ready true のまま維持されている。
    verification: go test ./internal/service -run 'PersonaGeneration|BodyReadiness|Retry|Cancel|SCN_PGP' が pass。
    fix_required: true
    status: resolved
  - id: BEHAVIOR-PGP-002
    level: major
    title: retry が retryable failure 以外でも phase run を running に戻す
    problem: >
      前回は `RetryPhase` が latest error と state の default rejection を持たず、Completed、
      Running、Paused、latest error なし、または retryable ではない failure でも running へ戻せた。
    reason: >
      最新実装では terminal job、snapshot drift、recoverable_failed 以外、retryable ではない error kind を
      rejected result にし、mutation を行わないため、SCN-PGP-008 の retry 条件に一致する。
    violated_condition: >
      retry は retryable failure の同じ phase run だけを対象にし、成功済み persona と未処理 target を区別して処理する。
    cause_candidate: >
      `RetryPhase` が許可 error kind 以外を拒否せず、requiredState に run.State を渡していた。
      最新実装では `personaGenerationRetryAllowed` と terminal / drift guard が追加されている。
    evidence:
      - path: internal/service/persona_generation_phase_service.go
        line: 415
        excerpt: terminal job では retry を rejected result にする。
      - path: internal/service/persona_generation_phase_service.go
        line: 418
        excerpt: snapshot drift では retry を rejected result にする。
      - path: internal/service/persona_generation_phase_service.go
        line: 421
        excerpt: personaGenerationRetryAllowed が false の時は retry を rejected result にする。
      - path: internal/service/persona_generation_phase_service.go
        line: 1835
        excerpt: retry は recoverable_failed かつ provider_failure / invalid_provider_response / input_missing だけ許可する。
      - path: internal/service/persona_generation_phase_service_test.go
        line: 290
        excerpt: completed / non-retryable save failure / terminal job で mutation なしを確認する。
      - path: internal/service/persona_generation_phase_service_test.go
        line: 340
        excerpt: snapshot drift の retry rejection と mutation なしを確認する。
    local_fix_assessment: resolved-local
    additional_check_scope: none。focused test と受領済み backend-local / all harness pass で確認済み。
    fix_considerations: frontend disabled state は補助であり、backend public seam 側の rejection が成立している。
    verification: go test ./internal/service -run 'PersonaGeneration|BodyReadiness|Retry|Cancel|SCN_PGP' が pass。
    fix_required: true
    status: resolved
  - id: BEHAVIOR-PGP-003
    level: major
    title: cancel が non-terminal / cancelable state に限定されていない
    problem: >
      前回は `CancelPhase` が requiredState を空にして mutation し、Completed、Failed、
      terminal job 上の run でも canceled に更新できた。
    reason: >
      最新実装では terminal job、snapshot drift、cancel 不可 state を rejected result にし、
      running / paused / recoverable_failed だけ cancel を許可するため、UI 契約と SCN-PGP-010 の条件に一致する。
    violated_condition: >
      cancel は cancel 可能な non-terminal job の phase run だけを対象にし、terminal job の state snapshot は変更しない。
    cause_candidate: >
      `CancelPhase` と `mutatePhaseState` が job terminal state と allowed transition を検証していなかった。
      最新実装では `personaGenerationCancelAllowed` と terminal / drift guard が追加されている。
    evidence:
      - path: internal/service/persona_generation_phase_service.go
        line: 458
        excerpt: terminal job では cancel を rejected result にする。
      - path: internal/service/persona_generation_phase_service.go
        line: 461
        excerpt: snapshot drift では cancel を rejected result にする。
      - path: internal/service/persona_generation_phase_service.go
        line: 464
        excerpt: personaGenerationCancelAllowed が false の時は cancel を rejected result にする。
      - path: internal/service/persona_generation_phase_service.go
        line: 603
        excerpt: mutatePhaseState でも terminal job と snapshot drift を再検証する。
      - path: internal/service/persona_generation_phase_service.go
        line: 1849
        excerpt: cancel は non-terminal job の running / paused / recoverable_failed だけ許可する。
      - path: internal/service/persona_generation_phase_service_test.go
        line: 364
        excerpt: completed run と terminal job で cancel rejection と mutation なしを確認する。
    local_fix_assessment: resolved-local
    additional_check_scope: none。focused test と受領済み backend-local / all harness pass で確認済み。
    fix_considerations: Wails public command から直接呼ばれても backend public seam 側で rejection が成立している。
    verification: go test ./internal/service -run 'PersonaGeneration|BodyReadiness|Retry|Cancel|SCN_PGP' が pass。
    fix_required: true
    status: resolved
