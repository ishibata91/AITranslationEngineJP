issues:
  - id: "RB-PGP-RESP-001"
    level: "major"
    title: "persona phase の production gateway 生成が root View に入っている"
    problem: "前回は App.svelte が persona phase の Wails gateway concrete と screen controller factory concrete を生成していた。最新差分では frontend/src/main.ts が production gateway と screen controller factory を生成し、App.svelte は注入 prop を AppShell へ渡すだけになった。"
    reason: "architecture は frontend/src/main.ts を frontend 全体の composition root とし、production 用 gateway を main.ts で生成して root view へ注入すると定義している。最新差分はこの依存方向へ戻っている。"
    violated_condition: "修正前は Frontend Bootstrap と root View の境界が破られていた。最新差分では破られていない。"
    cause_candidate: "修正前は persona phase の production wiring を main.ts へ追加せず、root View の fallback generation へ寄せた可能性がある。"
    evidence:
      - path: "frontend/src/main.ts"
        line: 24
        excerpt: "personaGenerationPhaseGateway を main.ts で生成している。"
      - path: "frontend/src/main.ts"
        line: 35
        excerpt: "createPersonaGenerationPhaseScreenController を App props へ渡している。"
      - path: "frontend/src/ui/App.svelte"
        line: 72
        excerpt: "App.svelte は createPersonaGenerationPhaseScreenController を AppShell へ渡している。"
      - path: "frontend/src/ui/App.test.ts"
        line: 1508
        excerpt: "注入した persona phase controller factory が Job Run 描画時に使われることを確認している。"
    local_fix_assessment: "resolved_by_local_frontend_bootstrap_wiring"
    additional_check_scope: "none。frontend/src/main.ts、frontend/src/ui/App.svelte、frontend/src/ui/views/AppShell.svelte、frontend/src/ui/screens/job-run/JobRunPage.svelte、frontend/src/ui/App.test.ts で解消を確認済み。"
    fix_considerations: "今後の同種追加でも production wiring は frontend/src/main.ts へ置き、App.svelte へ concrete fallback を追加しない。"
    verification: "呼び出し元提示の npm --prefix frontend run test -- --run persona-generation-phase、npm --prefix frontend run check、frontend-local harness pass で確認済み。レビュー agent では再実行していない。"
    fix_required: true
    status: "resolved"
  - id: "RB-PGP-RESP-002"
    level: "major"
    title: "screen controller factory が Wails gateway DTO を直接参照している"
    problem: "前回は screen controller factory が Wails gateway DTO 型を import していた。最新差分では screen controller factory の import が application contract、GatewayContract、Store、Presenter、UseCase、ScreenController に限定され、DTO 型確認は Wails gateway test 側へ移っている。"
    reason: "implementation-scope は frontend handoff で Wails 接続実体を統合境界 handoff に分け、integration handoff で frontend Wails adapter と gateway DTO を扱うと定義している。最新差分は DTO を Wails gateway / gateway test 側へ閉じている。"
    violated_condition: "修正前は ScreenController factory / Wails gateway DTO の境界が破られていた。最新差分では破られていない。"
    cause_candidate: "修正前は DTO coverage 型を Wails adapter 側ではなく screen controller factory 側へ置いた可能性がある。"
    evidence:
      - path: "frontend/src/controller/persona-generation-phase/persona-generation-phase-screen-controller-factory.ts"
        line: 1
        excerpt: "screen controller factory は application contract と GatewayContract に依存している。"
      - path: "frontend/src/controller/persona-generation-phase/persona-generation-phase-screen-controller-factory.ts"
        line: 19
        excerpt: "Store、Presenter、UseCase、ScreenController の結線だけを行っている。"
      - path: "frontend/src/controller/wails/persona-generation-phase.gateway.ts"
        line: 17
        excerpt: "Wails gateway DTO import は Wails adapter 側にある。"
      - path: "frontend/src/controller/wails/persona-generation-phase.gateway.test.ts"
        line: 60
        excerpt: "gateway DTO aliases と gateway contract の型整合確認が gateway test 側にある。"
    local_fix_assessment: "resolved_by_local_frontend_type_boundary"
    additional_check_scope: "none。frontend/src/controller/persona-generation-phase と frontend/src/controller/wails/persona-generation-phase.gateway.test.ts で解消を確認済み。"
    fix_considerations: "今後も DTO coverage 型確認は Wails gateway / gateway DTO / gateway test に置き、screen controller factory へ持ち込まない。"
    verification: "呼び出し元提示の npm --prefix frontend run check、npm --prefix frontend run test -- --run persona-generation-phase、frontend-local harness pass で確認済み。レビュー agent では再実行していない。"
