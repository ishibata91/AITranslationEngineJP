assessment:
  responsibility_boundary: >
    通過。Controller は UseCase port、UseCase は Service port、Service は repository / serializer /
    file writer port、Repository は SQLite concrete、Frontend UseCase は gateway contract と Store、
    View は ScreenController contract を使う配置になっている。production wiring は
    internal/bootstrap/app_controller.go で artifact repository、XML serializer、file writer、
    transactor、usecase、controller を明示接続している。
  evidence_sufficiency: >
    十分。implementation-scope、scenario-design、ui-design、plan、5 観点 reviewback、
    architecture / coding-guidelines、レビュー対象実コード、対象テスト、呼び出し元の修正後検証証跡を確認した。
    広い harness は人間指示と skill 規約に従い再実行していない。
  production_boundary_impact: >
    既存 fixture 互換の default serializer / file writer は Service constructor に残るが、
    production 経路では bootstrap の WithXMLSerializer、WithFileWriter、WithArtifactPersistence が
    明示接続する。default 生成は constructor 時点で filesystem 書き込みを行わず、
    persistence 未注入時も command 成功 fallback を持たないため、production boundary の隠れ依存にはなっていない。
  broken_boundaries: []
  cause_candidates: []
  local_fix_assessment: "未解決指摘なし。旧指摘は production wiring と persistence / file write 境界の明示接続で解消済み。"
  boundary_fixed_test_viewpoints:
    - "bootstrap が artifact repository、XML serializer、file writer、transactor を接続すること。"
    - "diff preview が artifact row repository read を通って stale / regenerate 状態を組み立てること。"
    - "writer が temporary file と publish の副作用境界を持ち、persistence 失敗時に成功 XML を公開しないこと。"
    - "frontend View が generated Wails binding や backend DTO を直接扱わず、controller contract だけを起点にすること。"

