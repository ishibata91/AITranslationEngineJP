    reason: "人間指示で広い harness の再実行が禁止され、review skill もハーネス実行を非対象にしている。"
    risk: "渡された pass 証跡後の環境差分は、この reviewer では再検出していない。"
  - target: "real xTranslator import smoke"
    reason: "scenario-design と implementation-scope で必須検証外と固定されている。"
    risk: "real xTranslator 固有の解釈差は残るが、責務境界 gate の対象ではない。"
  - target: "generated Wails JavaScript bindings"
    reason: "レビュー対象ファイルに含まれておらず、Go controller と frontend gateway の境界実装で確認した。"
    risk: "generated binding の実体差分は、最終集約または別観点で扱う必要がある。"

issues: []

residual_risks:
  - >
    Service constructor に fixture 互換 default serializer / file writer が残る。
    production bootstrap では明示注入されるため未解決 issue にはしないが、
    将来の production caller が WithXMLSerializer / WithFileWriter を省くと境界が曖昧になる。
  - >
    App.svelte には既存 fallback pattern と同じ controller factory fallback が残る。
    production main.ts は factory を注入しているため未解決 issue にはしないが、
    新しい root composition 方針を整理する場合は別 lane で一括判断する。
  - >
    diff preview は production repository の row reader を使う。
    test fixture 互換の legacy fallback は production 経路では使われないため gate issue にはしない。
