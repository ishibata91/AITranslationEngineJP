    risk: "提供済み pass 証跡後に環境差分があった場合は、このレビュー内では検出しない。"
  - target: "real xTranslator import smoke"
    reason: "scenario-design と implementation-scope で必須検証ではないと固定されている。"
    risk: "実 xTranslator 本体の取り込み差分は任意手動確認に残る。"
  - target: "契約・互換性、権限・信頼境界、状態・データ不変条件、責務境界の主判定"
    reason: "review_behavior の担当外であり、各 reviewback YAML の集約で扱う。"
    risk: "他観点の最終状態は implement_lane 側の review 集約に依存する。"

