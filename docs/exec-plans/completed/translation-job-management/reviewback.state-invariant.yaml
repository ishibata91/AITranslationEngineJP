unchecked_scope:
  - target: "SQLite 同時実行下で削除 transaction と実行開始 transaction が競合する実機再現"
    reason: "レビュー agent はハーネス実行を禁止されているため、差分読解と提供証跡で判定した。"
    risk: "実行開始側の transaction 境界が別差分で弱い場合、削除側の安全判定後に競合が起きる可能性は残る。ただし DeleteJob は transaction 内で候補再取得と phase guard を再評価している。"
  - target: "外部 JSON/file の OS 上の存在確認"
    reason: "削除差分は DB row の削除有無を対象にしており、ファイルシステム操作は差分内に存在しない。"
    risk: "外部 file 保持は削除処理が file delete を呼ばないことまでの確認に留まる。"

