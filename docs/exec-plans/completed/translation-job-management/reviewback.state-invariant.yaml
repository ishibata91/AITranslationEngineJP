invariant_test_viewpoints:
  - "job.State が running の job を削除要求しても、TRANSLATION_JOB と X_EDIT_EXTRACTED_DATA が残る。"
  - "job.State が paused で JOB_PHASE_RUN.state が running の job を削除要求しても、TRANSLATION_JOB、JOB_PHASE_RUN、TRANSLATION_JOB_PHASE_RUNTIME_SNAPSHOT、X_EDIT_EXTRACTED_DATA が残る。"
  - "JOB_PHASE_RUN.latest_error が stop_requested の job は、job.State が running 以外でも削除不可になる。"
  - "job.State が paused で phase run も paused の job は、job-owned row だけ削除され、X_EDIT_EXTRACTED_DATA と入力ファイル参照は残る。"
  - "同一 input と同一 source_content_hash の input 登録後に、Job Setup で複数 job を作成しても既存 job が上書きされない。"
