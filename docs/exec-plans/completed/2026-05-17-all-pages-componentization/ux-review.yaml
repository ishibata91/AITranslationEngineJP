ux_standard_judgement:
  status: pass_for_storybook_human_review_entry
  basis:
    - UI Design の UX Standard Review は、画面目的、主要CTA、情報階層、状態表示、状態別操作、検査可能性を pass としている。
    - UI Design は、画面責務、エラー状態、UI文言、幅別確認、長文耐性、最小幅保証を caution として Storybook review と人間見た目レビューへ残している。
    - Storybook review は主要 13 story を confirmed とし、本文あり、page error なしを記録している。
  judgement:
    - Storybook review 入口としては、目的、状態、操作、結果を判断する最低限の入口が揃っている。
    - caution は人間見た目レビュー時の確認対象であり、現時点では major 以上の停止理由ではない。

