    level: "major"
    title: "実 job setup 経路が pending phase run を事前作成し続ける"
    problem: "解決済み。以前は Ready job 作成の実経路で JOB_PHASE_RUN が pending state で保存されていたが、現在の createTranslationJobInTransaction は createReadyTranslationJob と savePhaseRuntimeSnapshots の後に read model を返し、phase run 作成 helper を呼ばない。"
    reason: "Ready job 作成時に JOB_PHASE_RUN を事前作成しない条件は、実 job setup 経路と setup service test の両方で確認できる。各 phase start 経路は、対象 phase run がない場合に start 時だけ非 pending run を作成する。"
    violated_condition: "解決前に破られていた条件は、Ready job には JOB_PHASE_RUN を事前作成しないこと、および pending を canonical state へ昇格しないことである。現在は破られていない。"
    cause_candidate: "解決前の原因候補は、translation_job_setup_service.go の createUnstartedPhaseRuns 呼び出しと pending draft 作成であった。現在は該当 helper と呼び出しが削除されている。"
    evidence:
      - path: "internal/service/translation_job_setup_service.go"
        line: 784
        excerpt: "createTranslationJobInTransaction は Ready job 作成と runtime snapshot 保存だけを行い、phase run を作成しない。"
