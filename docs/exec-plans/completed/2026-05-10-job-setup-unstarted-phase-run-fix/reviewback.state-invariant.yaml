    violated_condition: "開始、再送、同時実行では同じ JOB_PHASE_RUN の状態遷移が一度だけ成功し、重複副作用を作らない。"
    cause_candidate: "internal/repository/job_lifecycle_sqlite_repository.go の updateJobPhaseRun は WHERE id = :id だけで更新する。term、persona、body の開始処理は読み取り済みの idle_ready または not_started を前提に UpdateJobPhaseRun を呼ぶ。"
    evidence:
      - path: "internal/repository/job_lifecycle_sqlite_repository.go"
        line: 358
        excerpt: "updateJobPhaseRun は state を更新するが WHERE 条件は id のみである。"
      - path: "internal/repository/job_lifecycle_sqlite_repository.go"
        line: 812
        excerpt: "UpdateJobPhaseRun は RowsAffected による状態競合検出をしていない。"
      - path: "internal/service/term_translation_phase_service.go"
        line: 675
        excerpt: "term phase は読み取り済み run.State が idle_ready の場合に既存 row を running へ更新する。"
      - path: "internal/service/persona_generation_phase_service.go"
        line: 1408
        excerpt: "persona phase は currentRun.ID を状態条件なしの UpdateJobPhaseRun へ渡す。"
      - path: "internal/service/body_translation_phase_service.go"
        line: 483
        excerpt: "body phase は loaded.bodyRun が存在する場合に既存 row を状態条件なしで更新する。"
    local_fix_assessment: "cross-layer。repository の状態条件付き更新、service 側の競合検出、二重開始時の戻り値を合わせて扱う必要がある。"
    additional_check_scope: "term、persona、body の StartPhase 二重送信と、更新失敗時に provider 実行と結果保存へ進まないこと。"
