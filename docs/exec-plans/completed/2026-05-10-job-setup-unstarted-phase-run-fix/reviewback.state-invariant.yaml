    title: "未開始 phase row の開始昇格が状態条件なしで更新される"
    problem: "未開始 row を実行状態へ変える更新は、読み取り時点の state だけで開始可否を判断し、DB 更新時に state がまだ未開始であることを条件にしていない。"
