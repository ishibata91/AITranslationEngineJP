issues:
  - id: "behavior-001"
    level: "major"
    title: "Master Persona のモデル一覧更新導線がない"
    problem: "解消済み。MasterPersonaPage のモデル設定カードに、モデル一覧更新 icon が表示される。モデル未取得状態で、利用者は同じカード内から AI 設定再読み込みを実行できる。"
    reason: "AIModelSelectionCard は onRefresh が渡された場合に更新 icon button を表示する。MasterPersonaPage は onRefresh を渡し、controller.refreshAISettings から既存 loadAISettings を呼び出す。"
    violated_condition: "参照側ページのモデルカードから AIサービス、モデル、処理方式を変更でき、モデルカードのくるくるアイコンでモデル一覧を更新できること。"
    cause_candidate: "修正前原因は、MasterPersonaPage が AIModelSelectionCard に onRefresh を渡していなかったことである。reviewfix では MasterPersonaPage が onRefresh を渡し、MasterPersonaScreenController が loadAISettings へ接続したため、原因は実コード上で閉じている。"
    evidence:
      - path: "frontend/src/ui/components/AIModelSelectionCard.svelte"
        line: 181
        excerpt: "onRefresh がある場合に更新 icon button を描画する。"
      - path: "frontend/src/ui/screens/master-persona/MasterPersonaPage.svelte"
        line: 138
        excerpt: "AIModelSelectionCard に onRefresh が渡され、refreshAISettings を呼ぶ。"
      - path: "frontend/src/controller/master-persona/master-persona-screen-controller.ts"
        line: 210
        excerpt: "refreshAISettings は useCase.loadAISettings を呼ぶ。"
      - path: "frontend/src/application/usecase/master-persona/master-persona.usecase.ts"
        line: 105
        excerpt: "loadAISettings 成功時に aiSettings と modelOptions を更新する。"
      - path: "test-results/ui-reviewfix/master-persona-model-card.png"
        line: null
        excerpt: "Master Persona のモデル欄横に更新 icon が表示されている。"
    local_fix_assessment: "local"
    additional_check_scope: "none。behavior-001 の原因は Master Persona のカード内更新導線欠落であり、既存 loadAISettings 再利用で閉じている。"
    fix_considerations: "保存帯は Master Persona 固有操作としてカード外に置かれている。モデルカード内部の 3 ブロック構成と更新導線を崩さなければ、保存帯差分は挙動上問題にならない。"
    verification: "実装結果に npm --prefix frontend run check、対象テスト、build、frontend-local の pass が記録されている。UI 証跡で Master Persona と Job Setup のモデルカード表示を確認した。"
    fix_required: true
    status: "resolved"
