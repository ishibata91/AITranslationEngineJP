issues:
  - id: "state-invariant-001"
    level: "major"
    title: "モデル一覧更新失敗で AI 設定選択が default に戻る"
    problem: "修正前は refreshAISettings() から呼ばれる loadAISettings() の失敗時に、draft.aiSettings が default へ戻り、draft.modelOptions が空配列になっていた。"
    reason: "reviewfix2 では loadAISettings() 開始前の aiSettings と modelOptions を退避し、失敗時に退避値を保持する処理へ変わった。通常の再読み込み失敗経路では、provider、model、executionMethod、modelOptions が default と空配列へ戻らない。"
    violated_condition: "再読み込み失敗時は、既存の provider、model、executionMethod、modelOptions を破壊せず、errorMessage と更新中 state だけが失敗状態を表す。"
    cause_candidate: "修正前の原因は frontend/src/application/usecase/master-persona/master-persona.usecase.ts の catch 分岐が default と空配列を直接代入していたこと。reviewfix2 では同 catch 分岐が開始前 state の保持へ変更された。"
    evidence:
      - path: "frontend/src/application/usecase/master-persona/master-persona.usecase.ts"
        line: 109
        excerpt: "loadAISettings() は開始前の aiSettings と modelOptions を退避する。"
      - path: "frontend/src/application/usecase/master-persona/master-persona.usecase.ts"
        line: 126
        excerpt: "catch 分岐は既存選択がある場合に、退避した aiSettings と modelOptions を保持する。"
      - path: "frontend/src/application/usecase/master-persona/master-persona.usecase.ts"
        line: 130
        excerpt: "catch 分岐は errorMessage を失敗内容に更新する。"
    local_fix_assessment: "resolved。通常の失敗経路に限れば frontend usecase 内の局所修正で閉じている。"
    additional_check_scope: "none。通常の失敗経路に対する state 破壊は実コードで解消を確認した。"
    fix_considerations: "resolved。今後の変更でも失敗時に default と空配列へ戻す処理を復活させないことが不変条件である。"
    verification: "実装結果の npm --prefix frontend run check、対象 test、build、python3 scripts/harness/run.py --suite frontend-local の pass を確認した。"
    fix_required: true
    status: "resolved"
  - id: "state-invariant-002"
    level: "major"
    title: "更新中の選択変更が失敗時に開始前状態へ戻る"
    problem: "修正前は loadAISettings() が await 前に currentState を退避し、失敗時に退避した aiSettings と modelOptions を draft へ代入していた。再読み込み中も provider、model、executionMethod の select が操作可能だったため、利用者が更新中に変更した最新選択が失敗時に開始前の退避値で上書きされる競合状態があった。"
    reason: "reviewfix3 では isAISettingsRefreshing が true の間、provider、model、executionMethod、保存ボタン、更新ボタンが disabled になる。さらに各変更 handler と refresh handler が isAISettingsRefreshing で早期 return するため、失敗時 snapshot 復元と更新中の画面操作が競合しない。"
    violated_condition: "再読み込み失敗時は、その時点で画面が保持している provider、model、executionMethod、modelOptions を破壊せず、errorMessage と更新中 state だけが失敗状態を表す。"
    cause_candidate: "修正前の原因は frontend/src/ui/screens/master-persona/MasterPersonaPage.svelte が refresh 中 state を provider、model、executionMethod、保存操作に連動させていなかったこと。reviewfix3 では同画面が isAISettingsRefreshing を導入し、AIModelSelectionCard の disabled props と保存ボタンへ反映している。"
    evidence:
      - path: "frontend/src/ui/screens/master-persona/MasterPersonaPage.svelte"
        line: 64
        excerpt: "handleAIProviderChange() は isAISettingsRefreshing true で return する。"
      - path: "frontend/src/ui/screens/master-persona/MasterPersonaPage.svelte"
        line: 71
        excerpt: "handleAIModelChange() は isAISettingsRefreshing true で return する。"
      - path: "frontend/src/ui/screens/master-persona/MasterPersonaPage.svelte"
        line: 78
        excerpt: "handleAIExecutionMethodChange() は isAISettingsRefreshing true で return する。"
      - path: "frontend/src/ui/screens/master-persona/MasterPersonaPage.svelte"
        line: 85
        excerpt: "refreshAISettings() は controller 未提供または更新中なら return し、finally で更新中 state を解除する。"
      - path: "frontend/src/ui/screens/master-persona/MasterPersonaPage.svelte"
        line: 132
        excerpt: "executionDisabled は isAISettingsRefreshing に連動する。"
      - path: "frontend/src/ui/screens/master-persona/MasterPersonaPage.svelte"
        line: 137
        excerpt: "modelDisabled は isAISettingsRefreshing または canSelectModel false に連動する。"
      - path: "frontend/src/ui/screens/master-persona/MasterPersonaPage.svelte"
        line: 154
        excerpt: "providerDisabled は isAISettingsRefreshing に連動する。"
      - path: "frontend/src/ui/screens/master-persona/MasterPersonaPage.svelte"
        line: 185
        excerpt: "saveAiSettingsButton は isAISettingsRefreshing true で disabled になる。"
      - path: "frontend/src/ui/components/AIModelSelectionCard.svelte"
        line: 139
        excerpt: "provider select は providerDisabled を disabled へ反映する。"
      - path: "frontend/src/ui/components/AIModelSelectionCard.svelte"
        line: 169
        excerpt: "model select は modelDisabled を disabled へ反映する。"
      - path: "frontend/src/ui/components/AIModelSelectionCard.svelte"
        line: 235
        excerpt: "execution select は executionDisabled を disabled へ反映する。"
    local_fix_assessment: "resolved。frontend の Master Persona page と共通カード props の局所修正で閉じている。backend DTO、Wails gateway、保存項目の変更は不要である。"
    additional_check_scope: "none。画面操作経路の競合は実コードで解消を確認した。"
    fix_considerations: "resolved。今後の変更でも再読み込み中の provider、model、executionMethod、保存操作を snapshot 復元と並行させないことが不変条件である。"
    verification: "実装結果の npm --prefix frontend run check、対象 test、build、python3 scripts/harness/run.py --suite frontend-local の pass を確認した。UI 実画面での失敗注入は未実施だが、disabled 連動と handler guard は実コードで確認した。"
    fix_required: true
    status: "resolved"
