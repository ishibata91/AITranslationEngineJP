issues: []

trust_boundary_checks:
  authentication: "対象差分は画面内表示と controller 委譲のみで、未認証利用者向けの新規到達経路を追加していない。"
  authorization: "編集削除は viewModel.canMutate に従って無効化され、画面側で権限判定を迂回する別経路を追加していない。"
  tenant_isolation: "tenant 概念を扱う差分はない。plugin filter と identityKey は既存 controller 経路へ委譲される。"
  external_input: "JSON file input、検索語、plugin filter、編集 textarea/input は Svelte の通常バインディングと controller 委譲に留まる。{@html}、innerHTML、fetch、localStorage、sessionStorage、console 出力は対象 UI 差分に存在しない。"
  secret_pii: "AI 設定表示は provider、model、executionMethod、credential status label に限定され、API key、token、secret 本体の表示、保存、ログ出力を追加していない。"
  injection: "対象 UI 差分に HTML 注入、URL 組み立て、外部 URL 呼び出し、SQL 生成、SSRF 経路、ファイル内容の直接解釈は見当たらない。"

secret_checks:
  destinations: "secret 本体の新規送信先は追加されていない。AI 設定操作は既存 controller.saveAISettings と refreshAISettings に委譲される。"
  display: "表示される AI 設定は provider、model、executionMethod、status label であり、secret 本体は表示されない。"
  storage: "UI 差分内に localStorage、sessionStorage、IndexedDB、直接ファイル保存は追加されていない。"
  logging: "対象 UI 差分に console、log、error summary への secret 出力は追加されていない。"
  naming_separation: "credentialStatusLabel は状態表示として使われ、api_key、token、secret_ref と secret 本体の同名混在は見当たらない。"

