issues:
  - id: "behavior-001"
    level: "major"
    title: "補助操作の accessible name が承認済み文言とずれる"
    problem: "解決済み。表示上は `編集` と `中止` だが、旧実装では `aria-label` により支援技術向けの操作名が `更新` と `停止` になっていた。現実装では旧 `aria-label` が削除され、ボタン本文の `編集` と `中止` が公開操作名になる。"
    reason: "UI 改善契約は補助操作として `編集` と `中止` を指定している。現実装の対象ボタンには旧 `aria-label` がなく、App.test.ts の master-persona 期待値も `編集` と `中止` に更新されているため、承認済み文言との差分は残っていない。"
    violated_condition: "承認済み UI 改善契約の文言方針と補助操作名。"
    cause_candidate: "旧 UI 互換の accessible name が残っていた。現実装では対象 2 ボタンから旧 `aria-label` が削除され、単体テスト期待値も新しい公開操作名へ更新された。"
    evidence:
      - path: "docs/exec-plans/completed/2026-05-04-master-data-ux-refactor/ui-design.md"
        line: 22
        excerpt: "secondary_actions は `一時停止`、`中止`、`編集`、`削除` を指定している。"
      - path: "frontend/src/ui/screens/master-persona/RunStatusPanel.svelte"
        line: 67
        excerpt: "`中止` ボタンに旧 `aria-label=\"停止\"` はなく、ボタン本文が `中止` である。"
      - path: "frontend/src/ui/screens/master-persona/PersonaReviewPanel.svelte"
        line: 141
        excerpt: "`編集` ボタンに旧 `aria-label=\"更新\"` はなく、ボタン本文が `編集` である。"
      - path: "frontend/src/ui/App.test.ts"
        line: 1274
        excerpt: "編集ボタンの accessible name 期待値が `編集` である。"
      - path: "frontend/src/ui/App.test.ts"
        line: 1529
        excerpt: "中止ボタンの accessible name 期待値が `中止` である。"
      - path: "docs/exec-plans/completed/2026-05-04-master-data-ux-refactor/reviewfix.behavior-001.md"
        line: 17
        excerpt: "frontend-local と frontend test が成功し、旧 accessible name が master-persona 画面配下に残っていないと記録されている。"
    local_fix_assessment: "local"
    additional_check_scope: "none。対象 2 ボタンの実コード、master-persona 画面の role/name テスト、旧 `aria-label` 検索を確認済みである。"
    fix_considerations: "解決済み。今後同じ補助操作を変更する場合も、表示文言と accessible name を同じ操作語へ揃える。"
    verification: "`git diff --check -- frontend/src/ui/screens/master-persona/RunStatusPanel.svelte frontend/src/ui/screens/master-persona/PersonaReviewPanel.svelte frontend/src/ui/App.test.ts` 成功。`python3 scripts/harness/run.py --suite frontend-local` 成功。frontend test は `42 passed (files) / 421 passed (tests)`。"
    fix_required: true
    status: "resolved"
