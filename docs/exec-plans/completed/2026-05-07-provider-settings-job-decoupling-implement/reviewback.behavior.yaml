issues:
  - id: "behavior-001"
    level: "major"
    title: "モデル一覧の stale 判定が常に通り得る"
    problem: "修正前は、作成前検証 payload からモデル一覧取得時の sourceToken または同等の鮮度根拠が service validation へ渡らなかった。"
    reason: "修正後は、frontend が modelListFreshnessToken を validation/create payload に含め、Wails / Go usecase が service の ModelListSourceToken へ渡す。service validation は selection 由来 token と provider settings 再解決後 token を比較するため、provider settings 更新後の古いモデル一覧選択を stale と判定できる。"
    violated_condition: "Job Setup の作成前検証は、モデル一覧更新後の選択だけを fresh と扱い、古いモデル一覧由来の選択を stale として拒否する。"
    cause_candidate: "修正前は、credential 参照実値と modelListSourceToken の公開削除時に、鮮度根拠を validation request へ渡す代替経路がなかった。"
    evidence:
      - path: "frontend/src/application/usecase/translation-job-setup/translation-job-setup.usecase.ts"
        line: 467
        excerpt: "toPhaseRuntimeValidationSelection が modelList.sourceToken を modelListFreshnessToken に変換する。"
      - path: "frontend/src/controller/wails/translation-job-setup.gateway.ts"
        line: 63
        excerpt: "toPhaseRuntimeSelectionDto が modelListFreshnessToken を DTO に含める。"
      - path: "internal/usecase/translation_job_setup_usecase.go"
        line: 235
        excerpt: "toServiceTranslationJobSetupPhaseRuntimes が FreshnessToken を ModelListSourceToken へ渡す。"
      - path: "internal/service/translation_job_setup_service.go"
        line: 963
        excerpt: "validatePhaseRuntime が selection 由来の ModelListSourceToken を保持する。"
      - path: "internal/service/translation_job_setup_service.go"
        line: 1007
        excerpt: "selection 由来 token と再解決後 token が空または不一致なら model_selection_stale になる。"
      - path: "internal/service/translation_job_setup_service.go"
        line: 1427
        excerpt: "translationJobSetupModelListSourceToken は phase|provider||requestToken 形式で token を作る。"
    local_fix_assessment: "cross-layer"
    additional_check_scope: "none。frontend payload、Wails / Go usecase contract、service validation、fake API の同一変更範囲で解消を確認した。"
