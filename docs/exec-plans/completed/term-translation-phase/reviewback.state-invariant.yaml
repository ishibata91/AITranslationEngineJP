issues:
  - id: SI-001
    level: major
    title: provider 途中失敗で同一 attempt の辞書 partial state が commit されないこと
    problem: >
      旧指摘では、複数 AI 対象語の先行 candidate 保存後に後続 candidate が
      provider failure または invalid response になると、先行保存分と failure state が
      同じ transaction で commit される可能性があった。
    reason: >
      最新差分では applyExecutionPlan が provider failure、invalid response、save failure を
      attempt failure error として返し、SQLiteTransactor は callback error で rollback する。
      executePhase は rollback 後に persistAttemptFailure を別 transaction で実行し、
      failed / retryable state だけを残す。
    violated_condition: >
      解決前に破られていた条件は、provider failure、invalid response、save failure で
      failed / retryable state と辞書未更新を観測でき、partial dictionary state は残らないこと。
      最新差分では条件を維持している。
    cause_candidate: >
      旧原因は recoverable failure を command response として返すために error を nil にし、
      transaction rollback 条件と失敗 attempt の辞書反映禁止が分離していたこと。
      最新差分では attempt failure を error path に戻し、failure state persistence を
      rollback 後の局所処理へ分離している。
    evidence:
      - path: internal/service/term_translation_phase_service.go
        line: 453
        excerpt: executePhase は executePhaseTransaction を transactor.WithTransaction 内で実行する。
      - path: internal/service/term_translation_phase_service.go
        line: 491
        excerpt: applyExecutionPlan が error を返すと captureAttemptFailure 後に error を transaction callback へ返す。
      - path: internal/service/term_translation_phase_service.go
        line: 793
        excerpt: aiTargets は順番に applyProviderCandidate で保存され、途中失敗は error で抜ける。
      - path: internal/service/term_translation_phase_service.go
        line: 925
        excerpt: provider failure は failProviderCandidate の attempt failure error になる。
      - path: internal/service/term_translation_phase_service.go
        line: 928
        excerpt: invalid response は failInvalidProviderCandidate の attempt failure error になる。
      - path: internal/service/term_translation_phase_service.go
        line: 1688
        excerpt: rollback 後の failure state 永続化は別 WithTransaction で実行される。
      - path: internal/repository/transactor_sqlite.go
        line: 29
        excerpt: transaction callback error は rollback され、nil の時だけ commit される。
      - path: internal/service/term_translation_phase_service_test.go
        line: 615
        excerpt: save failure 後に job dictionary entry と phase link が 0 件であることを検証している。
    local_fix_assessment: resolved_by_local_service_transaction_boundary
    additional_check_scope: >
      provider 2 件目だけ failure にした row count test を追加すると回帰検出は強くなる。
      現在の判定では、同じ attempt failure error path と rollback test により open 指摘は解決済みと扱う。
    fix_considerations: >
      今後の変更では、recoverable failure を command response として返す場合でも、
      attempt 内で作成した辞書 entry / phase link を commit しない境界を維持する必要がある。
    verification:
      status: verified
      command: env GOCACHE=/private/tmp/aitranslationenginejp-go-cache go test ./internal/service -run 'TestTermTranslationPhaseServiceReturnsSaveFailedAndRollsBackPartialDictionaryState|TestTermTranslationPhaseServiceReadNextPhaseReadinessUsesCandidateCoverage'
      result: passed
      final_validation_input: execution harness passed; system-test 5 tests passed; frontend tests 334 passed; coverage and Sonar gates passed.
    fix_required: true
    status: resolved

  - id: SI-002
    level: major
    title: 後続 phase guard が candidate coverage で成立すること
    problem: >
      旧指摘では、next phase readiness と Job Run の canStartNextPhase が、
      現在の候補語に対応する confirmed count ではなく job 内辞書全体の entry 数で
      判定される可能性があった。
    reason: >
      最新差分では buildRunState が summarizeConfirmedCandidates で candidate-specific
      confirmed count を作り、ReadSummary は resultSummary.ConfirmedCount を readiness に渡す。
      ReadNextPhaseReadiness も buildRunState で得た confirmedTerms を
      summarizeConfirmedCandidates に通し、候補外 entry を除外して readinessFromState を呼ぶ。
    violated_condition: >
      解決前に破られていた条件は、term phase 未完了、失敗、辞書参照不能では後続 phase run を
      作成せず、完了時だけ後続 phase 入力 summary が成立すること。最新差分では
      candidate coverage が不足する completed run も後続 phase 開始不可になる。
    cause_candidate: >
      旧原因は result summary 用 confirmedCount と readiness guard 用 confirmedCount が別経路になり、
      readiness 側だけ len(confirmedTerms) を使っていたこと。最新差分では両方を
      candidateKey(recordType, sourceTerm) に一致する confirmed count へ揃えている。
    evidence:
      - path: internal/service/term_translation_phase_service.go
        line: 300
        excerpt: ReadSummary は resultSummary.ConfirmedCount を readiness に渡す。
      - path: internal/service/term_translation_phase_service.go
        line: 425
        excerpt: ReadNextPhaseReadiness は buildRunState から confirmedTerms と errorSummary を読む。
      - path: internal/service/term_translation_phase_service.go
        line: 429
        excerpt: ReadNextPhaseReadiness は summarizeConfirmedCandidates の confirmed count を使う。
      - path: internal/service/term_translation_phase_service.go
        line: 1194
        excerpt: summarizeConfirmedCandidates は candidateKey 一致分だけ confirmedCount に含める。
      - path: internal/service/term_translation_phase_service.go
        line: 1449
        excerpt: readinessFromState は completed run かつ confirmedCount >= totalCount の場合だけ通す。
      - path: internal/service/term_translation_phase_service_test.go
        line: 645
        excerpt: 候補外 entry があっても candidate coverage 不足なら CanStartNextPhase は false になる。
    local_fix_assessment: resolved_by_local_readiness_coverage_alignment
    additional_check_scope: >
      job dictionary entry 削除または参照不能時の guard test は追加余地がある。
      現在の open 指摘である候補外 entry による guard bypass は focused test で解決を確認した。
    fix_considerations: >
      今後の変更では、UI の canStartNextPhase、summary の unmatchedCount、
      next phase readiness が同じ candidate coverage 値を使う必要がある。
    verification:
      status: verified
      command: env GOCACHE=/private/tmp/aitranslationenginejp-go-cache go test ./internal/service -run 'TestTermTranslationPhaseServiceReturnsSaveFailedAndRollsBackPartialDictionaryState|TestTermTranslationPhaseServiceReadNextPhaseReadinessUsesCandidateCoverage'
      result: passed
      final_validation_input: execution harness passed; system-test 5 tests passed; frontend tests 334 passed; coverage and Sonar gates passed.
    fix_required: true
    status: resolved

  - id: SI-003
    level: major
    title: job state が phase state と二重に中断・失敗状態へ遷移する
    problem: >
      旧指摘では、task 正本が job を Running のまま維持し、単語翻訳フェーズの
      完了、中断、回復可能失敗、再実行準備を phase state で区別すると固定しているのに、
      PausePhase と markPhaseRunFailure が `TRANSLATION_JOB.state` も
      paused / recoverable_failed / failed へ更新していた。
    reason: >
      最新差分では PausePhase が phase run を paused にする一方で job state を running に保つ。
      markPhaseRunFailure も phase run state を recoverable_failed または failed にする一方で、
      job state は running に保つ。pause、recoverable provider failure、non-retryable
      save failure の focused test でも同じ不変条件を確認している。
    violated_condition: >
      解決前に破られていた条件は、job は Running のまま、単語翻訳フェーズ固有の
      完了、中断、回復可能失敗、再実行準備を `JOB_PHASE_RUN.state` で区別すること。
      最新差分では条件を維持している。
    cause_candidate: >
      旧原因は PausePhase と markPhaseRunFailure の helper が、phase run state の更新と
      translation job aggregate state の更新を同じ状態語彙で結合していたこと。
      最新差分では helper 内の UpdateTranslationJob が running を保持するよう揃っている。
    evidence:
      - path: docs/exec-plans/active/term-translation-phase/scenario-design.md
        line: 91
        excerpt: job は Running のまま phase state で完了、中断、回復可能失敗、再実行準備を区別すると固定している。
      - path: docs/exec-plans/active/term-translation-phase/ui-design.md
        line: 24
        excerpt: Job Run の button enablement でも job Running と phase state の分離を前提にしている。
      - path: internal/service/term_translation_phase_service.go
        line: 381
        excerpt: PausePhase は phase run を paused にした後、translation job state を running に更新する。
      - path: internal/service/term_translation_phase_service.go
        line: 1084
        excerpt: markPhaseRunFailure は phase run state を分岐した後、translation job state を running に更新する。
      - path: internal/service/term_translation_phase_service_test.go
        line: 469
        excerpt: pause 後も translation job state running を assertion している。
      - path: internal/service/term_translation_phase_service_test.go
        line: 599
        excerpt: provider failure 後も snapshot link だけを保持し、translation job state running を assertion している。
      - path: internal/service/term_translation_phase_service_test.go
        line: 799
        excerpt: save_failed の failed phase state 後も translation job state running を assertion している。
    local_fix_assessment: resolved_by_local_service_state_update_with_test_alignment
    additional_check_scope: >
      追加の open 確認範囲はない。Pause、recoverable provider failure、
      non-retryable save failure の focused test で `TRANSLATION_JOB.state` が
      running のまま残ることを確認した。
    fix_considerations: >
      今後の変更でも、phase-local failure と job terminal state を結合しない。
      terminal job の開始拒否、term phase 未完了時の後続 phase 不可、partial dictionary rollback は維持する。
    verification:
      status: verified
      command: env GOCACHE=/private/tmp/aitranslationenginejp-go-cache go test ./internal/service
      result: passed
      final_validation_input: >
        呼び出し元検証で env GOCACHE=/private/tmp/aitranslationenginejp-go-cache
