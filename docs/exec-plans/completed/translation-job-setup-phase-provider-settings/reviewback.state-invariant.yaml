issues:
  - id: "state-invariant-001"
    level: "major"
    title: "遅延 model list 失敗応答が現在 phase state を上書きできる"
    problem: >
      前回は `refreshPhaseModels` の failure branch が最新 phase state と
      `requestToken` を確認せず、古い failed state を現在 phase へ書き込めた。
      再修正後は failure branch が request-local phase id の最新 selection と
      providerModelLists を読み直し、provider または `requestToken` が一致しない場合 return する。
    reason: >
      provider 変更後または同一 phase の再取得後に古い request が reject しても、
      現在 provider の providerModelLists、model、modelListSourceToken、validation state を
      failed へ巻き戻す経路が閉じている。
    violated_condition: >
      provider または APIキー状態変更後、遅延 model list response は現在 phase state へ混入しない。
    cause_candidate: >
      原因は failure branch の stale guard 欠落だった。再修正後は
      `latestSelection.provider !== selection.provider` と
      `latestModelList?.requestToken !== requestToken` で失敗応答を破棄する。
    evidence:
      - path: "frontend/src/application/usecase/translation-job-setup/translation-job-setup.usecase.ts"
        line: 782
        excerpt: "catch branch が latest phase selection と providerModelLists の requestToken を確認して stale failure を return する。"
      - path: "frontend/src/application/usecase/translation-job-setup/translation-job-setup.usecase.test.ts"
        line: 604
        excerpt: "provider 変更後の遅延 model list rejection が現在 phase state を上書きしない regression test が追加されている。"
      - path: "frontend/src/application/usecase/translation-job-setup/translation-job-setup.usecase.ts"
        line: 743
        excerpt: "success branch も latest phase selection と providerModelLists の requestToken を確認している。"
    local_fix_assessment: "resolved-local-frontend-state"
    additional_check_scope: "none: focused regression と実コードで前回不変条件の解消を確認した。"
    fix_considerations: >
      今後 model list adapter を増やす場合も、phase id、provider、requestToken の現在性を
      success / failure で同じ基準に保つ必要がある。
    verification: >
      呼び出し元提示の frontend-local / all harness pass と、state-invariant-001 focused test を確認した。
    fix_required: true
    status: "resolved"
