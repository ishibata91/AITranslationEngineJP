issues:
  - id: "responsibility-boundary-001"
    level: "major"
    title: "provider model list の provider 別 HTTP / endpoint / decode が service package に残っている"
    problem: >
      前回レビューでは TranslationJobSetupService package 内に
      translationJobSetupProviderModelListLoaderFromTransport、
      newTranslationJobSetupProviderModelsRequest、decodeTranslationJobSetup*ModelList が残り、
      service test も HTTP transport fallback を固定していた。
      再修正後は該当 symbol と HTTP detail が service package から消えている。
    reason: >
      architecture.md は Service が AIProvider を使い、Service core が driver 固有 API を直接参照しないことを求めている。
      再修正後の provider 別 endpoint、HTTP header、base URL、response decode は internal/infra/ai に閉じているため、
      Service core と AIProvider / infra adapter の境界は維持されている。
    violated_condition: "Service core と AIProvider / infra adapter の責務境界。"
    cause_candidate: >
      前回は infra adapter 追加後も旧 service-local transport fallback と test seam が残っていた。
      再修正後は service-local fallback を削除し、service option と fake loader test へ寄せた。
    evidence:
      - path: "internal/service/translation_job_setup_service.go"
        line: 3
        excerpt: "service imports に net/http、encoding/json、net/url、os が存在しない。"
      - path: "internal/service/translation_job_setup_service.go"
        line: 336
        excerpt: "TranslationJobSetupProviderModelListLoader interface で provider model list を受ける。"
      - path: "internal/service/translation_job_setup_service.go"
        line: 422
        excerpt: "ListProviderModels は credential gate と redacted failure mapping を行う。"
      - path: "internal/service/translation_job_setup_service.go"
        line: 1385
        excerpt: "requestProviderModels は loader 呼び出しと read model 正規化だけを行う。"
      - path: "internal/infra/ai/provider_models.go"
        line: 103
        excerpt: "ListProviderModels が provider 別 HTTP / endpoint / decode を扱う。"
      - path: "internal/infra/ai/provider_models_test.go"
        line: 10
        excerpt: "adapter test が provider 別 endpoint と decode を固定する。"
      - path: "internal/service/translation_job_setup_service_test.go"
        line: 155
