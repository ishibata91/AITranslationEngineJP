    level: "major"
    title: "View の未公開 controller 拡張依存は解消済み"
    problem: >
      前回レビューでは JobSetupPage.svelte が ExtendedController を定義し、
      gateway contract の phase 型と helper へ直接依存していた。
      再修正後の JobSetupPage.svelte は screen controller contract と presenter view model を import し、
      phase provider / model / batch 操作を controller contract の公開 method として呼んでいる。
