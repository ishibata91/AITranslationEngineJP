    violated_condition: "implementation-scope の `ListTranslationJobSetupProviderModels` seam。"
    cause_candidate: "前回原因は frontend Wails gateway adapter / DTO / gateway contract の更新不足だった。現在の差分では同じ seam が adapter まで実装済みである。"
