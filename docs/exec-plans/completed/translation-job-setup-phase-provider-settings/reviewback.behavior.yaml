    violated_condition: "LM Studio は API key 不要 provider として credential missing failure にならず、model 候補から model を選び、validation を通過し、create 評価へ進める必要がある。"
    cause_candidate: "前回原因だった UI draft、model list sourceToken、backend validation の credentialRef 不一致は解消済みである。frontend/src/application/usecase/translation-job-setup/translation-job-setup.usecase.ts:122、internal/service/translation_job_setup_service.go:446、internal/service/translation_job_setup_service.go:861、internal/service/translation_job_setup_service.go:1207 が根拠である。"
