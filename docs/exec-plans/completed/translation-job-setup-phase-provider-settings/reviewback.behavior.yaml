issues:
  - id: "behavior-001"
    level: "major"
    title: "LM Studio の model list 成功が model 選択可能状態にならない"
    problem: "前回指摘時は frontend が success だけを model 選択可能、局所 create 可能として扱っていた。現在は credential_not_required も usable として扱う。"
    reason: "frontend usecase と presenter の isModelListUsable は success と credential_not_required を許可し、LM Studio の model 選択テストも backend sourceToken 形に揃っている。"
    violated_condition: "LM Studio は credential missing failure にならず、model 候補状態から model を設定できる必要がある。"
    cause_candidate: "frontend 側の usable 判定不一致は修正済みである。frontend/src/application/usecase/translation-job-setup/translation-job-setup.usecase.ts:417 と frontend/src/application/presenter/translation-job-setup/translation-job-setup.presenter.ts:157 が根拠である。"
    evidence:
      - path: "frontend/src/application/usecase/translation-job-setup/translation-job-setup.usecase.ts"
        line: 417
        excerpt: "isModelListUsable は success と credential_not_required を true にする。"
      - path: "frontend/src/application/presenter/translation-job-setup/translation-job-setup.presenter.ts"
        line: 157
        excerpt: "presenter 側も credential_not_required を model select 表示可能にしている。"
      - path: "frontend/src/application/usecase/translation-job-setup/translation-job-setup.usecase.test.ts"
        line: 647
        excerpt: "LM Studio の credential_not_required で model list 後に model を選択できるテストがある。"
    local_fix_assessment: "resolved。frontend 表示条件と model 選択条件の局所修正で閉じている。"
    additional_check_scope: "none。behavior-003 の sourceToken 整合も解決済みである。"
    fix_considerations: "LM Studio では API key 入力、credential select、API key 未設定 warning を出さない条件を維持する。"
    verification: "frontend usecase、presenter、JobSetupPage test で確認済みである。"
    fix_required: true
    status: "resolved"

  - id: "behavior-002"
    level: "major"
    title: "APIキー登録モーダルが credential missing を解消しない"
    problem: "前回指摘時は APIキー登録モーダルが apiKeyInput を backend や secret store へ渡さず、frontend store の credentialRefs だけを書き換えていた。現在は backend の SaveTranslationJobSetupCredential 経路へ apiKey を渡す。"
    reason: "UI は controller.savePhaseCredential へ apiKeyInput を渡し、frontend usecase は gateway.saveTranslationJobSetupCredential を呼び、Wails controller は usecase SaveTranslationJobSetupCredential へ接続し、backend service は secretStore.Save を呼ぶ。"
    violated_condition: "API key 必須 provider では同じ画面のモーダルで API key を登録し、保存後は対象 phase のモデル一覧更新から再開できる必要がある。"
    cause_candidate: "local state だけの configured 化は修正済みである。frontend/src/ui/screens/translation-job-setup/JobSetupPage.svelte:131、frontend/src/application/usecase/translation-job-setup/translation-job-setup.usecase.ts:870、internal/service/translation_job_setup_service.go:496 が根拠である。"
    evidence:
      - path: "frontend/src/ui/screens/translation-job-setup/JobSetupPage.svelte"
        line: 131
        excerpt: "submitCredentialModal は apiKeyInput を controller.savePhaseCredential へ渡す。"
      - path: "frontend/src/application/usecase/translation-job-setup/translation-job-setup.usecase.ts"
        line: 870
        excerpt: "savePhaseCredential は persistPhaseCredential へ apiKey を渡す。"
      - path: "internal/controller/wails/translation_job_setup_controller.go"
        line: 312
        excerpt: "SaveTranslationJobSetupCredential は usecase の credential save port へ接続されている。"
      - path: "internal/service/translation_job_setup_service.go"
        line: 521
        excerpt: "SaveCredential は secretStore.Save に credentialRef と apiKey を保存する。"
    local_fix_assessment: "resolved。UI から backend secret store までの保存経路は接続済みである。"
    additional_check_scope: "none。API key 保存後の実 provider model list 成功は呼び出し元の frontend-local / backend-local / all pass 証跡を入力として扱った。"
    fix_considerations: "API key 平文や secret 本体を DTO、UI、error summary、structured log、fake transport log、保存要約へ出さない条件を維持する。"
    verification: "source 読み取りと呼び出し元提供の backend-local、frontend-local、all harness pass で確認済みである。"
    fix_required: true
    status: "resolved"

