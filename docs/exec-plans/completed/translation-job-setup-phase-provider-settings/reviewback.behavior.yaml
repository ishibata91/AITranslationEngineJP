    level: "major"
    title: "LM Studio の sourceToken が validation で stale 扱いになる"
    problem: "前回指摘時は LM Studio 選択後も sourceToken の credentialRef と validation の credentialRef 正規化が一致せず、model_selection_stale になり得た。現在は frontend、model list、validation が LM Studio の credentialRef を空へ揃える。"
