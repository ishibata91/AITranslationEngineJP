issues:
  - id: "trust-boundary-001"
    level: "blocker"
    title: "Job Setup の CredentialRef が master-persona secret namespace を参照できる"
    problem: >
      前回レビューでは、Job Setup の Wails / usecase / service 境界が `CredentialRef` を
      Job Setup 所有の許可参照へ照合せず、共有 secret store の任意 key として扱っていた。
      再修正後は provider ごとの default credential 参照だけへ正規化され、
      `master-persona:<provider>` は secret lookup key、secret save key、
      model list external request、phase runtime snapshot の保存値にならない。
    reason: >
      `translationJobSetupNormalizeCredentialRef` は credential 必須 provider でも
      provider catalog の default credential ref と一致しない入力を空文字へ正規化する。
      `ListProviderModels` は空参照または missing で secret load 前に `credential_missing` を返す。
      `SaveCredential` は空参照化された許可外 credential を保存しない。
      `ValidateRequest` と `EvaluateCreateRequest` は同じ正規化後の credential 状態で
      create を止めるため、Wails / usecase 到達経路では snapshot 保存と phase 実行へ進まない。
    violated_condition: >
      解消済み。Job Setup は master-persona credential を secret 解決元として使わない。
      phase 実行時は対象 phase の Job Setup 保存設定だけを参照し、
      `CredentialRef` は Job Setup が公開した provider 別 credential 参照に限定される。
    cause_candidate: >
      前回原因は、Job Setup service が共有 secret store を使いながら
      request の `CredentialRef` を provider catalog の許可参照へ照合していなかったことである。
      再修正後は service の model list、save、sanitize、validation、create gate が
      provider catalog による allowlist 正規化を共有している。
    evidence:
      - path: "internal/service/translation_job_setup_service.go"
        line: 1207
        excerpt: "`translationJobSetupNormalizeCredentialRef` は provider default と一致しない credential 参照を空文字へ正規化する。"
      - path: "internal/service/translation_job_setup_service.go"
        line: 462
        excerpt: "`ListProviderModels` は空参照または missing で `credential_missing` を返し、secret load へ進まない。"
      - path: "internal/service/translation_job_setup_service.go"
        line: 506
        excerpt: "`SaveCredential` は正規化後の空参照を required error にし、secret save へ進まない。"
      - path: "internal/service/translation_job_setup_service.go"
        line: 849
        excerpt: "`validatePhaseRuntime` は許可外 credential 参照を credential_missing として create 不可にする。"
      - path: "internal/service/translation_job_setup_service.go"
        line: 594
        excerpt: "`EvaluateCreateRequest` は create 前に `ValidateRequest` を再実行する。"
      - path: "internal/usecase/translation_job_setup_usecase.go"
        line: 171
        excerpt: "usecase の create 経路は `EvaluateCreateRequest` 通過時だけ `CreateTranslationJob` を呼ぶ。"
      - path: "internal/service/translation_job_setup_service_test.go"
        line: 295
        excerpt: "`master-persona:gemini` で model list が credential_missing になり、secret load と provider loader が呼ばれない。"
      - path: "internal/service/translation_job_setup_service_test.go"
        line: 322
        excerpt: "`master-persona:gemini` の credential save が拒否され、secret save が発生しない。"
      - path: "internal/service/translation_job_setup_service_test.go"
        line: 333
        excerpt: "`master-persona:gemini` を phase runtime に入れた validation が credential_missing で止まる。"
      - path: "internal/service/translation_job_setup_service_test.go"
        line: 373
        excerpt: "LM Studio の model list は credential_not_required になり、secret lookup が発生しない。"
      - path: "internal/infra/ai/provider_models.go"
        line: 145
        excerpt: "OpenAI 互換 provider の secret は Authorization header だけへ入る。"
      - path: "internal/infra/ai/provider_models.go"
        line: 215
        excerpt: "Gemini の secret は URL ではなく `x-goog-api-key` header へ入る。"
      - path: "frontend/src/application/usecase/translation-job-setup/translation-job-setup.usecase.ts"
        line: 136
        excerpt: "frontend は Wails 未接続以外の error message を固定文言へ redaction する。"
      - path: "frontend/src/ui/screens/translation-job-setup/JobSetupPage.svelte"
        line: 126
        excerpt: "credential modal close 時に API key 入力値を空にする。"
    local_fix_assessment: >
      resolved。局所修正は backend service の allowlist 正規化で閉じている。
      Wails / usecase は service gate を通る既存構成で足りる。
      将来 `CreateTranslationJob` executor を usecase の `EvaluateCreateRequest` なしで新規呼び出ししない条件は維持が必要である。
    additional_check_scope: "なし。前回 blocker の対象経路は focused test とコード読み取りで確認済みである。"
    fix_considerations: >
      解決済みのため修正命令は不要である。
      維持すべき条件は、Job Setup credential ref の allowlist を provider catalog へ固定し、
      master-persona namespace を secret lookup key として扱わないことである。
    verification: >
      呼び出し元提供証跡として backend-local、frontend-local、all が pass。
      focused test では `master-persona:gemini` が model list、secret load、provider loader、
      secret save、validation を進めないこと、LM Studio が secret load なしで
      credential_not_required になること、read model と UI に secret 本体が出ないことを確認した。
    fix_required: true
    status: "resolved"
