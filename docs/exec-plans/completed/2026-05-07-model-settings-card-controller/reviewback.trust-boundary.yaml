issues:
  - id: "trust-boundary-001"
    level: "blocker"
    title: "内部 request 識別子が共有カード状態契約へ露出している"
    problem: "修正済み。ModelSettingsModelListState、ModelSettingsCardState、ModelSettingsCardViewModel、MasterPersonaScreenState、Master Persona DTO から requestToken と sourceToken が除去されている。"
    reason: "遅延 model list 応答の破棄に使う token は MasterPersonaUseCase の private state に閉じており、共有カード状態と Master Persona 画面状態へコピーされない。Translation Job Setup の既存 provider model list response には token が残るが、toModelSettingsCards では共有カード状態へ provider、credentialStatus、status、models、failureKind だけを写している。"
    violated_condition: "解消済み。内部 request 識別子は UI、DTO、console、log、error summary へ出さない。権限・信頼境界グループは hard gate として相殺しない。"
    cause_candidate: "解消済み。修正前は遅延応答破棄用 token と画面向け共有カード state が同じ ModelSettingsModelListState にまとまっていた。修正後は Master Persona 側の token を usecase private state へ閉じ、共有カード state は公開表示値だけを持つ。"
    evidence:
      - path: "frontend/src/application/gateway-contract/model-settings-card/model-settings-card-contract.ts"
        line: 32
        excerpt: "ModelSettingsModelListState は provider、credentialStatus、status、models、failureKind だけを持つ。"
      - path: "frontend/src/application/gateway-contract/model-settings-card/model-settings-card-contract.ts"
        line: 50
        excerpt: "ModelSettingsCardViewModel は表示用 field だけを持ち、requestToken と sourceToken を持たない。"
      - path: "frontend/src/application/gateway-contract/master-persona/master-persona-gateway-contract.ts"
        line: 90
        excerpt: "MasterPersonaProviderModelsResponse は provider、credentialStatus、status、models、failureKind だけを持つ。"
      - path: "frontend/src/application/gateway-contract/master-persona/master-persona-gateway-contract.ts"
        line: 174
        excerpt: "MasterPersonaScreenState は ModelSettingsCardState を保持するが、token field を追加していない。"
      - path: "frontend/src/application/usecase/master-persona/master-persona.usecase.ts"
        line: 232
        excerpt: "requestToken は refreshAISettings 内の local 変数と activeModelListRequest.token に閉じている。"
      - path: "frontend/src/application/usecase/master-persona/master-persona.usecase.ts"
        line: 133
        excerpt: "toModelSettingsListState は response から provider、credentialStatus、status、models、failureKind だけを共有カード状態へ写す。"
      - path: "internal/controller/wails/master_persona_controller.go"
        line: 131
        excerpt: "MasterPersonaModelListDTO は public model-list state without request identifiers として定義されている。"
      - path: "frontend/src/application/usecase/translation-job-setup/translation-job-setup.usecase.ts"
        line: 366
        excerpt: "toModelSettingsCards は既存 response の requestToken と sourceToken を共有カード状態へコピーしない。"
    local_fix_assessment: "resolved。frontend contract、Master Persona usecase、Wails DTO、Job Setup の共有カード変換経路の範囲で閉じている。"
    additional_check_scope: "今後 Translation Job Setup の provider model list response 全体を UI、console、error summary に出す変更を入れる場合は、既存 requestToken / sourceToken の露出を再確認する。"
    fix_considerations: "解消済み。遅延応答破棄の不変条件は、非公開の token 管理で維持する必要がある。公開 DTO、screen state、view model へ token を戻さないことが残る条件である。"
    verification: "静的確認として対象候補へ requestToken / sourceToken を検索し、共有カード contract と Master Persona contract / DTO / store / usecase に露出がないことを確認した。呼び出し元証跡では npm --prefix frontend run check、npm --prefix frontend run test、go test ./internal/...、scenario-gate、coverage が通過している。"
    fix_required: true
    status: "resolved"
