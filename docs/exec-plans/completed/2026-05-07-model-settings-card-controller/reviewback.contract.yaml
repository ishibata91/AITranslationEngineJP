issues:
  - id: "contract-001"
    level: "major"
    title: "Master Persona の credential state が DTO 由来ではなく provider 名から合成されていた"
    problem: >
      修正前は Master Persona の共有モデル設定カードが `credentialStatus` を
      Wails DTO から受け取らず、frontend usecase が provider 名から合成していた。
      修正後は `MasterPersonaAISettingsResponse` と
      `MasterPersonaProviderModelsResponse` が credential state を運ぶ。
    reason: >
      修正後の通常経路では、API キー未設定の Gemini / xAI は backend 由来の
      `missing` として providerOptions または modelList から共有カードへ渡る。
      `lm_studio` は backend 由来または fallback の `not_required` として扱われる。
    violated_condition: >
      Wails DTO と frontend gateway DTO は provider / model / credential state /
      model list status を同じ意味で扱う。共有カードの credential state は
      実 credential 状態または not_required を表す。
    cause_candidate: >
      修正前は `MasterPersonaAISettingsDTO` が credential state を含まず、
      frontend usecase が provider 名だけで credential state を補完していた。
      修正後は `MasterPersonaAISettingsResponseDTO` と
      `MasterPersonaModelListDTO` が credential state を運ぶ。
    evidence:
      - path: "internal/controller/wails/master_persona_controller.go"
        line: 140
        excerpt: "MasterPersonaAISettingsResponseDTO は providerOptions と modelList を持つ。"
      - path: "internal/controller/wails/master_persona_controller.go"
        line: 257
        excerpt: "MasterPersonaLoadAISettings は LoadAISettingsState の結果を DTO 化して返す。"
      - path: "internal/service/master_persona_service.go"
        line: 354
        excerpt: "LoadSettingsState は provider settings 由来の providerOptions と initial modelList を返す。"
      - path: "frontend/src/application/usecase/master-persona/master-persona.usecase.ts"
        line: 113
        excerpt: "credentialStatus は modelList.credentialStatus または providerOptions から決まる。"
      - path: "frontend/src/application/usecase/master-persona/master-persona.usecase.test.ts"
        line: 700
        excerpt: "Gemini と xAI の credentialStatus missing を応答 fixture で扱う。"
    local_fix_assessment: "fixed-cross-layer"
    additional_check_scope: "none。contract-001 の修正確認に必要な Wails DTO、frontend gateway DTO、usecase、service、関連テストを確認済みである。"
    fix_considerations: >
      今後 credential state を追加変更する場合も、API キー本体、復号可能値、
      raw request、raw response、内部 request token は DTO へ出さない。
      provider / model の保存元と provider settings の credential 参照元を混同しない。
    verification: >
      提供証跡では frontend check、frontend test、go test、scenario-gate、
      coverage が通過している。review_contract では再実行していない。
    fix_required: true
    status: "resolved"
