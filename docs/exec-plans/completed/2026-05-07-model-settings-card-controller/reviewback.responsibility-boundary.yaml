issues:
  - id: "responsibility-boundary-001"
    level: "minor"
    title: "View 側に共有カード view model の fallback 組み立てが残っている"
    problem: "GenerationSetupPanel.svelte が createFallbackModelCard で provider options、credential 表示、model list 表示文言、ボタン状態を組み立てている。これは presenter が作るべき共有カード view model の代替整形であり、View が UI Component へ props を渡す責務を少し越えている。"
    reason: "architecture.md は View を UI Component の組み合わせと DOM event の受け渡しに限定し、Presenter が Store state から view model を組み立てると定めている。現在の presenter は modelSettingsCardViewModel を常に返しているため実行時影響は小さいが、fallback 経路が残ると provider/model 表示規則が presenter と View に分散する。"
    violated_condition: "View は表示部品の組み合わせと event 受け渡しに留め、表示整形は Presenter または共有 model-settings-card policy に集約する。"
    cause_candidate: "frontend/src/ui/screens/master-persona/GenerationSetupPanel.svelte:50 の createFallbackModelCard が、旧 viewModel 互換のために表示モデルを View 内で再構築している可能性がある。"
    evidence:
      - path: "frontend/src/ui/screens/master-persona/GenerationSetupPanel.svelte"
        line: 50
        excerpt: "createFallbackModelCard が providerOptions、credentialStatus、modelListStatusText、statusLabel を View 内で組み立てている。"
      - path: "frontend/src/application/presenter/master-persona/master-persona.presenter.ts"
        line: 187
        excerpt: "presenter は buildModelSettingsCardViewModel で modelSettingsCardViewModel を返している。"
      - path: "docs/architecture.md"
        line: 63
        excerpt: "View は UI Component を組み合わせ、DOM event を ScreenController へ渡す。"
    local_fix_assessment: "local"
    additional_check_scope: "MasterPersonaPresenter が全呼び出し経路で modelSettingsCardViewModel を返す前提を確認する範囲。"
    fix_considerations: "fallback を残す場合でも、provider options と model list 文言の正本が presenter と共有 policy に分散しないことを保つ。"
    verification: "frontend の presenter / screen component test で modelSettingsCardViewModel が欠落しないこと、または fallback を削除して既存 UI test が通ることを確認する。"
    fix_required: false
    status: "open"

boundary_breaks:
  - boundary: "View / Presenter"
    status: "minor-open"
    evidence: "frontend/src/ui/screens/master-persona/GenerationSetupPanel.svelte:50"
    detail: "View が共有カード view model fallback を持つ。実行時の主経路は presenter 生成の view model を使うため、修正必須ではない。"

cause_candidates:
  - cause: "旧 viewModel 互換の fallback を画面側へ残した。"
    evidence: "frontend/src/ui/screens/master-persona/GenerationSetupPanel.svelte:50"
  - cause: "shared model card policy の導入後も、画面 component 側の代替 path を消していない。"
    evidence: "frontend/src/application/presenter/master-persona/master-persona.presenter.ts:187"

local_fix_assessment:
  overall: "局所修正で閉じる。GenerationSetupPanel.svelte の fallback を presenter 出力前提へ寄せるか、fallback 作成を shared policy / presenter 側へ戻すだけでよい。Wails、DTO、backend、fakeAPI への波及は不要である可能性が高い。"
  boundary_fixed_tests:
    - "MasterPersonaPresenter が modelSettingsCardViewModel を返すことを単体テストで固定する。"
    - "GenerationSetupPanel.svelte が providerOptions や credential 表示規則を独自構築しないことを静的確認する。"

