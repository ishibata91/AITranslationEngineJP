issues:
  - id: "behavior-001"
    level: "major"
    title: "マスターペルソナ側で model list 更新が実一覧取得になっていない"
    problem: "マスターペルソナの共有カードは、モデル一覧更新時に provider の model list を取得せず、保存済み AI 設定を再読込している。候補一覧も保存済み model 1 件から作られるため、provider 変更後に model list を更新して model を選ぶ経路が成立しない。"
    reason: "解消済み。修正後のマスターペルソナ gateway contract には listMasterPersonaProviderModels があり、refreshAISettings は loadMasterPersonaAISettings ではなく listMasterPersonaProviderModels を呼ぶ。backend 側も MasterPersonaListProviderModels から usecase と service を経由し、provider settings の ListProviderModels へ接続されている。"
    violated_condition: "SCN-MSCC-002、SCN-MSCC-004、SCN-MSCC-008、SCN-MSCC-010。マスターペルソナと翻訳ジョブ設定が同じモデル設定カード制御を使い、model list 更新、credential 条件、空一覧、更新不可を同じ操作規則で扱う条件。"
    cause_candidate: "解消済み。frontend/src/application/gateway-contract/master-persona/master-persona-gateway-contract.ts:268 に listMasterPersonaProviderModels が追加された。frontend/src/application/usecase/master-persona/master-persona.usecase.ts:250 は gateway.listMasterPersonaProviderModels を呼ぶ。internal/service/master_persona_service.go:395 は providerSettings.ListProviderModels へ接続する。"
    evidence:
      - path: "frontend/src/application/usecase/master-persona/master-persona.usecase.ts"
        line: 250
        excerpt: "refreshAISettings は listMasterPersonaProviderModels に provider を渡し、provider model list 取得結果を待つ。"
      - path: "frontend/src/application/usecase/master-persona/master-persona.usecase.ts"
        line: 255
        excerpt: "activeModelListRequest と response.provider と現在 provider を照合し、遅延応答を現在状態へ反映しない。"
      - path: "frontend/src/application/usecase/master-persona/master-persona.usecase.ts"
        line: 88
        excerpt: "credentialStatusForProvider は backend 由来 providerOptions から APIキー状態を決め、未登録 provider は missing とする。"
      - path: "frontend/src/controller/wails/master-persona.gateway.ts"
        line: 120
        excerpt: "listMasterPersonaProviderModels は MasterPersonaListProviderModels binding を呼ぶ。"
      - path: "internal/controller/wails/master_persona_controller.go"
        line: 265
        excerpt: "MasterPersonaListProviderModels は usecase.ListProviderModels へ provider を渡す。"
      - path: "internal/service/master_persona_service.go"
        line: 395
        excerpt: "service.ListProviderModels は providerSettings.ListProviderModels を呼び、取得した models と credential state を返す。"
    local_fix_assessment: "cross-layer resolved。マスターペルソナ側の application gateway contract、usecase、presenter、Wails gateway、backend controller、backend usecase、backend service の接続で修正済みである。"
    additional_check_scope: "未確認範囲は production 実 provider の model list 取得だけである。理由は実 API 呼び出しと広いハーネス再実行が人間指示で禁止されているためである。"
    fix_considerations: "修正後確認では、Job Setup 側の遅延応答破棄、通常 provider ID の維持、fake provider 非表示、secret 非露出、参照側保存 namespace の分離を壊していないことを前提にした。呼び出し元の修正後検証は通過している。"
    verification: "呼び出し元証跡では npm --prefix frontend run check、npm --prefix frontend run test、go test ./internal/...、scenario-gate、coverage が通過している。Sonar coverage は 70.5%、security 0、reliability 0、maintainability HIGH 0 である。"
    fix_required: true
    status: "resolved"
