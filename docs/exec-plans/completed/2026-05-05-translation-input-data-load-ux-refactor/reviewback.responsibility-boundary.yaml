residual_risks:
  - "localizeUiText は現行の承認済み範囲では表示整形として許容できる。ただし置換対象が増える場合、Presenter の表示値生成責務へ戻す判断が必要になる。"
  - "LoadedInputList.svelte と LoadedInputDetail.svelte は view model 由来の TranslationInputReviewItem 型を受けている。現時点では controller、store、gateway、generated binding への直接依存ではないが、表示以外の判断を component 側へ増やすと責務境界が弱くなる。"
  - "レビュー対象外差分は本成果物の判断に含めていない。"
