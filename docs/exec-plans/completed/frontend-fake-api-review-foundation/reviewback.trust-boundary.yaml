issues:
  - id: "trust-boundary-001"
    level: "major"
    title: "URL 入力だけで本番 composition root が fake gateway を選択できる"
    problem: "修正前は、window.location.search に fakeApi が存在するだけで createReviewFakeApiAppFactories を選択できた。修正後は reviewModeEnabled が false の本番起動相当では enabled が false になり、URL 入力だけでは fake gateway を選択できない。"
    reason: "frontend/src/main.ts は reviewModeEnabled に import.meta.env.DEV を渡す。frontend/src/controller/review-fake-api/review-fake-api-runtime.ts は options.reviewModeEnabled と fakeApi の存在を同時に満たす時だけ enabled を true にする。局所テストは fakeApi と fakeScenario が両方ある本番起動相当で enabled false を確認している。"
    violated_condition: "修正前は、本番起動でモックデータや fake gateway が混入しない条件を破っていた。修正後は、本番起動相当で fakeAPI を選ばない条件を満たす。"
    cause_candidate: "修正前の原因は、fakeApi の存在だけを enabled 条件にしていたことである。修正後は reviewModeEnabled が enabled 条件に追加され、composition root の DI 分岐前にレビュー起動許可を確認する。"
    evidence:
      - path: "frontend/src/main.ts"
        line: 19
        excerpt: "reviewModeEnabled に import.meta.env.DEV を渡している。"
      - path: "frontend/src/controller/review-fake-api/review-fake-api-runtime.ts"
        line: 111
        excerpt: "enabled は options.reviewModeEnabled と triggerValue !== null の両方で決まる。"
      - path: "frontend/src/controller/review-fake-api/review-fake-api-runtime-context.test.ts"
        line: 25
        excerpt: "本番起動相当では fakeApi と fakeScenario の両方を無視するテストがある。"
      - path: "frontend/src/main.ts"
        line: 22
        excerpt: "enabled が false の時は createProductionAppFactories を選ぶ。"
    local_fix_assessment: "local。composition root と URL runtime context の局所修正で閉じている。"
    additional_check_scope: "追加必須なし。配布ビルド済み成果物での import.meta.env.DEV 置換確認は残留リスクとして記録済みである。"
    fix_considerations: "将来レビュー起動許可を変える場合も、URL 入力だけを許可条件にしない。状態パターン ID 以外のモックデータ本文、内部診断、secret 本体を URL、log、UI 文言へ出さない条件を維持する。"
    verification: "npm --prefix frontend run test -- src/controller/review-fake-api は pass。python3 scripts/harness/run.py --suite frontend-local は pass。局所テストは本番起動相当で fakeApi と fakeScenario の両方を無視する条件を確認している。"
    fix_required: true
    status: "resolved"
