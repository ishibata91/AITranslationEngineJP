assessment:
  responsibility_boundary: "責務境界は維持されている。fakeAPI 起動判定と本番 gateway との差し替えは frontend bootstrap 側の composition root に閉じている。状態パターン解決と fake gateway registry は frontend controller 配下のレビュー用 adapter 境界に置かれている。View、ScreenController、Frontend UseCase は generated wailsjs を直接参照していない。レビュー専用 UI と状態パターン選択 UI は追加されていない。"
  evidence_sufficiency: "十分。承認済み implementation-scope、最終検証証跡、指定された実コード、局所テスト、UI シナリオテストを確認した。ハーネスは review_responsibility_boundary の非対象規約と人間指示に従い再実行していない。"
  responsibility_boundary_maintenance_level: "high"
  broken_boundaries: []
  cause_candidates: []
  local_fix_assessment: "未解決指摘がないため局所修正は不要。後続で画面別 fake data を増やす場合は、registry 追加を controller/review-fake-api 配下に閉じ、View や UseCase に起動条件判定を持ち込まない確認が必要である。"
  boundary_fixed_test_viewpoints:
    - "本番起動相当では fakeScenario が無視され、Wails gateway だけが選ばれること。"
    - "fakeAPI 起動時だけ registry 由来の gateway が ScreenController factory へ注入されること。"
    - "registry 未登録や欠落モックデータが Wails gateway fallback や成功状態へ流れないこと。"
    - "UI シナリオテストが既存画面構造を使い、レビュー専用 UI と状態パターン選択 UI を追加していないこと。"

