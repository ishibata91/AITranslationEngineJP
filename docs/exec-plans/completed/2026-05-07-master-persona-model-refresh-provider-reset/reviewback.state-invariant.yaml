issues:
  - id: "state-invariant-001"
    level: "major"
    title: "refresh 中の provider 変更で古い modelOptions が再投入されうる"
    problem: "解決済み。refreshAISettings は成功時 update で応答時点の draft.aiSettings を currentSettings として読み、開始時 snapshot の古い provider/modelOptions を後続状態へ再投入しない。"
    reason: "refresh 開始後、gateway 応答前に user が provider を変更した場合、currentSettings.provider と refreshProvider が一致しないため canRefreshModel は false になる。そのため gateway が返した model と loadedModelOptions は反映されない。"
    violated_condition: "モデル一覧更新操作では、現在 UI で選択している provider を保存済み空値または古い snapshot で上書きしない。provider 変更時に model と modelOptions を空にする状態遷移を後続の非同期応答で破らない。"
    cause_candidate: "解消済み。frontend/src/application/usecase/master-persona/master-persona.usecase.ts:158 は refresh 開始時の provider だけを比較用に保持し、同ファイル:163 以降は応答時点の draft.aiSettings と provider 一致判定を使う。"
    evidence:
      - path: "frontend/src/application/usecase/master-persona/master-persona.usecase.ts"
        line: 158
        excerpt: "refresh 開始時の provider は refreshProvider として比較用に保持される。"
      - path: "frontend/src/application/usecase/master-persona/master-persona.usecase.ts"
        line: 163
        excerpt: "成功時 update は draft.aiSettings から currentSettings を作る。"
      - path: "frontend/src/application/usecase/master-persona/master-persona.usecase.ts"
        line: 165
        excerpt: "currentSettings.provider と refreshProvider が一致する場合だけ canRefreshModel が true になる。"
      - path: "frontend/src/application/usecase/master-persona/master-persona.usecase.ts"
        line: 174
        excerpt: "canRefreshModel が true かつ loadedModelOptions がある場合だけ modelOptions が更新される。"
      - path: "docs/exec-plans/active/2026-05-07-master-persona-model-refresh-provider-reset/frontend-implementation-result.md"
        line: 39
        excerpt: "成功時の provider と実行方法は store.update 時点の draft.aiSettings から維持すると記録されている。"
    local_fix_assessment: "local。usecase 内の refreshAISettings 変更で閉じている。"
    additional_check_scope: "none。指定入力内では対象 usecase 単体テスト通過と実コード上の状態更新条件を確認できた。"
    fix_considerations: "解決確認済み。今後の変更でも、手動 refresh は応答時点の provider 選択を優先し、provider 変更で空にした modelOptions を古い options で復元しない条件を維持する。"
    verification: "frontend 実装結果に、対象 usecase 単体テスト 28 件通過が記録されている。実コードでは canRefreshModel が false の場合に model と modelOptions を反映しないことを確認した。"
