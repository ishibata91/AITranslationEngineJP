    level: "major"
    title: "existingJob 応答 field の意味互換性破壊"
    problem: "修正前は、既存 job が存在する input を候補から除外した後、options 応答の existingJob が候補内の ExistingJob だけから復元されるため、既存 job が存在しても existingJob が nil になる経路があった。"
    reason: "修正後は、loadTranslationInputCandidates が inputCandidates と existingJob を別返却し、currentOptionsReadModel が existingJob を候補配列とは独立して応答へ設定する。既存 job 参照 input は continue で候補から除外され、最初の既存 job summary は existingJob として保持される。"
    violated_condition: "既存公開応答 field は、版管理または明示的な契約変更なしに意味を変えない。"
    cause_candidate: "修正前の原因候補は、existingJob 復元が候補配列内 ExistingJob に依存していたことである。修正後は input ごとに既存 job を確認し、候補除外と summary 返却を同じ読み取り経路で分離している。"
    evidence:
      - path: "internal/service/translation_job_setup_service.go"
        line: 1044
        excerpt: "currentOptionsReadModel は inputCandidates と existingJob を loadTranslationInputCandidates から別々に受け取る。"
      - path: "internal/service/translation_job_setup_service.go"
        line: 1086
        excerpt: "jobForInput が存在する場合、最初の summary を existingJob に保持し、当該 input は候補へ追加せず continue する。"
      - path: "internal/service/translation_job_setup_service.go"
        line: 1118
        excerpt: "loadExistingJobForInput は inputSourceID から ExistingJob summary を作る。"
      - path: "internal/service/translation_job_setup_service_test.go"
        line: 524
        excerpt: "既存 job 参照 input は候補から除外され、ExistingJob summary は保持されることを検証している。"
    local_fix_assessment: "local。options 読み取り経路の局所修正で閉じており、DTO 型、削除 API、DB schema の再設計は不要と判断した。"
