issues:
  - id: "responsibility-boundary-001"
    level: "major"
    title: "UseCase の detail-to-list 同期で navigation readiness が落ちる"
    problem: "解決済み。TranslationJobManagementUseCase の syncDetailIntoList は action response detail を一覧 summary へ戻す時に canOpenPhase と openBlockedReason を写像する。修正後は stop/resume/delete などの action response 後も、presenter が canOpenPhase=false の phase page target を再生成しない。"
    reason: "Frontend UseCase は画面状態の更新手順を担い、Presenter は view model 整形と target 生成可否を担う。修正後は backend readiness seam が frontend contract、usecase state、presenter、view model へ欠落なく伝播し、View は presenter 由来の target に従うだけで済む。"
    violated_condition: "解決済み。境界変換の責務。公開接点の readiness seam は Frontend UseCase の state 同期で保持され、Presenter が canOpenPhase=false の jobRunTarget を作らない条件を全経路で維持する。"
    cause_candidate: "解決済み。前回原因は syncDetailIntoList が旧 summary 項目だけを再構築し、canOpenPhase と openBlockedReason を落としていたこと。修正後は frontend/src/application/usecase/translation-job-management/translation-job-management.usecase.ts:385 で canOpenPhase を同期し、同:386 で openBlockedReason をコピーする。"
    evidence:
      - path: "frontend/src/application/usecase/translation-job-management/translation-job-management.usecase.ts"
        line: 385
        excerpt: "syncDetailIntoList が detail.canOpenPhase を list item へ同期する。"
      - path: "frontend/src/application/usecase/translation-job-management/translation-job-management.usecase.ts"
        line: 386
        excerpt: "syncDetailIntoList が detail.openBlockedReason を list item へコピーする。"
      - path: "frontend/src/application/presenter/translation-job-management/translation-job-management.presenter.ts"
        line: 271
        excerpt: "toJobCard は detail.canOpenPhase !== false を判定値にする。"
      - path: "frontend/src/application/presenter/translation-job-management/translation-job-management.presenter.ts"
        line: 290
        excerpt: "toJobCard は canOpenPhase=false の場合に jobRunTarget を null にする。"
      - path: "frontend/src/application/presenter/translation-job-management/translation-job-management.presenter.ts"
        line: 325
        excerpt: "toJobRunTarget は selected detail の canOpenPhase=false で null を返す。"
      - path: "frontend/src/application/usecase/translation-job-management/translation-job-management.usecase.test.ts"
        line: 375
        excerpt: "action response 後も開けない理由を一覧へ同期し phase page target を再生成しないテストがある。"
      - path: "frontend/src/application/presenter/translation-job-management/translation-job-management.presenter.test.ts"
        line: 211
        excerpt: "action response 後の一覧状態でも phase page target を作らないテストがある。"
    local_fix_assessment: "resolved。backend readiness 判定、gateway contract、presenter、View の主経路は維持したまま、Frontend UseCase 内の detail-to-list 同期だけで readiness seam 欠落を閉じている。責務境界上は局所修正として妥当である。"
    additional_check_scope: "none。今回の確認範囲では、UI component / View、Presenter、Frontend UseCase、Gateway の責務境界に新規 major 以上 issue はない。"
    fix_considerations: "修正済み確認。View 側へ再判定を増やさず、backend 由来の readiness seam を usecase state に保持し、presenter が jobRunTarget 生成可否を一元化する境界を維持している。"
    verification: "呼び出し元証跡として npm --prefix frontend run check、npm --prefix frontend run test -- --run src/application/usecase/translation-job-management src/application/presenter/translation-job-management、python3 scripts/harness/run.py --suite frontend-local、python3 scripts/harness/run.py --suite coverage が pass。coverage は 70.3% >= 70.0、security 0、reliability 0、maintainability HIGH 0。"
    fix_required: false
    status: "resolved"
