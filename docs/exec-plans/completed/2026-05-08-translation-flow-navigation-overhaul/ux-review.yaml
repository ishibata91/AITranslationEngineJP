human_review_rereview:
  reason: frontend 実装が人間レビュー差し戻しへ対応したため再確認した。
  returned_points:
    - id: human-rereview-001
      title: 翻訳セクションから Job Setup とデータロードへ直接遷移できる。
      status: resolved
      evidence:
        - shell-state の translationManagementViews は directNavigation true を未完了 job 一覧だけにしている。
        - 実画面 snapshot で未完了 job 一覧だけが tab/button で、データロード、Job Setup、各フェーズ、翻訳完了、出力管理は参照のみ表示である。
      ux_judgement: 直接移動可能な翻訳セクション項目は未完了 job 一覧だけである。
    - id: human-rereview-002
      title: 各フェーズの情報が翻訳セクションから失われており現在地が分からない。
      status: resolved
      evidence:
        - 実画面 snapshot で翻訳セクションに単語翻訳、NPC ペルソナ生成、本文翻訳、翻訳完了、出力管理が表示される。
        - Job #402 の本文翻訳表示では本文翻訳ステップが現在位置として表示される。
      ux_judgement: ユーザーは翻訳セクション上で現在ページと前後工程を判断できる。
    - id: human-rereview-003
      title: 各翻訳フェーズを参照表示にし、一覧以外への直接移動を禁止する。
      status: resolved
      evidence:
        - TranslationManagementStepper は directNavigation false の項目を div で描画し、button と onSelect を持たない。
        - 実画面 snapshot で未完了 job 一覧以外は参照のみとして表示される。
      ux_judgement: 各翻訳フェーズは工程参照として表示され、直接移動の入口にはなっていない。
    - id: human-rereview-004
      title: sticky footer が sticky ではないページがある。
      status: resolved
      evidence:
        - StickyActionFooter は position fixed、bottom 1rem、z-index 20 で viewport 下部に固定される。
        - PhaseNavigationFooter は StickyActionFooter を使って各フェーズの移動 footer を描画する。
        - 390x844 の本文翻訳ページで footer は position fixed、bottom 16px、viewport 下端から 16px に表示された。
        - JobRunPage は mobile で padding-bottom 16rem を持ち、本文と footer の重なりを避ける。
      ux_judgement: 対象フェーズページの footer は viewport 下部固定として扱える。
    - id: human-rereview-005
      title: データロード画面の翻訳設定への移動が本文内 button で、sticky footer ではない。
      status: resolved
      evidence:
        - InputReviewPage は canOpenJobSetup(viewModel.selectedItem) が true の時だけ StickyActionFooter を描画する。
        - StickyActionFooter の primaryLabel は "翻訳設定へ進む" で、onPrimary は onOpenJobSetup だけを呼ぶ。
        - LoadedInputDetail には "Job Setup へ進む" button が残っていない。
        - LoadedInputDetail は次の手順説明だけを残し、移動操作を本文内に持たない。
        - InputReviewPage は footer 分として desktop 10rem、mobile 14rem の padding-bottom を持つ。
        - InputReviewPage.test.ts は登録成功後に footer 内 button click が onOpenJobSetup を 1 回呼ぶことを確認している。
        - InputReviewPage.test.ts は failed item では翻訳設定へ進む button を表示しないことを確認している。
      ux_judgement: データロードから Job Setup への移動操作は sticky footer に統一された。実画面では fake success の登録済みデータ 0 件により footer 表示状態へ到達できなかったが、実装と対象テストで表示条件と callback は確認できる。

