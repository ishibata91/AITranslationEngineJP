issues:
  - id: "behavior-001"
    level: "major"
    title: "phase run 不在許容が ready job に限定されていない"
    problem: "解決済みである。現在の termTranslationExecutionBasePhase は、run が nil で初期 execution phase が見つからない場合でも、job state が ready でない場合は not found error を返す。"
    reason: "実装目的は ready job かつ JOB_PHASE_RUN 0 件を実行前状態として表示することである。現在の分岐は非 ready job を許容対象から外しているため、running 代表状態の summary と next phase readiness は既存どおり service error になる。"
    violated_condition: "ready job かつ JOB_PHASE_RUN 0 件だけを正として扱い、実行済み job、実行中 job、完了 job の既存読み取り意味を不要に変えないこと。"
    cause_candidate: "修正前は ErrNotFound の許容条件に job state が含まれない可能性があった。現在は internal/service/term_translation_phase_service.go:1380 で job.State を渡し、internal/service/term_translation_phase_service.go:1845 で jobState != termTranslationJobStateReady をエラー条件にしている。"
    evidence:
      - path: "internal/service/term_translation_phase_service.go"
        line: 1380
        excerpt: "loadExecutionContext は termTranslationExecutionBasePhase に job.State を渡している。"
      - path: "internal/service/term_translation_phase_service.go"
        line: 1845
        excerpt: "run != nil、jobState != ready、ErrNotFound 以外のいずれかでは error を返す。"
      - path: "internal/service/term_translation_phase_service_test.go"
        line: 475
        excerpt: "running job かつ phase run 0 件の summary は load initial execution phase: not found を返す。"
      - path: "internal/service/term_translation_phase_service_test.go"
        line: 1164
        excerpt: "running job かつ phase run 0 件の next phase readiness は load initial execution phase: not found を返す。"
      - path: "docs/exec-plans/completed/2026-05-10-job-1-term-summary-resume-investigate/regression-test-evidence.md"
        line: 35
        excerpt: "major 指摘対応後の go test、backend-local、coverage は成功している。"
    local_fix_assessment: "resolved。loadExecutionContext と termTranslationExecutionBasePhase の局所修正で閉じている。ready job の空状態、非 ready job の error 維持、既存 run の execution 設定読み取りを対象単体テストが確認している。"
    additional_check_scope: "none。未解決指摘として追加確認が必要な範囲はない。残留リスクは unchecked_scope に記録した。"
    fix_considerations: "解決済みのため追加修正指示はない。今後変更する場合も、ready job の空状態を service error に戻さず、非 ready job の phase run 不在を成功扱いに広げない条件を維持する必要がある。"
    verification: "呼び出し元の go test ./internal/service -run 'TestTermTranslationPhaseServiceRead(Summary|NextPhaseReadiness)' -count=1、python3 scripts/harness/run.py --suite backend-local、python3 scripts/harness/run.py --suite coverage は成功している。"
    fix_required: true
    status: "resolved"
