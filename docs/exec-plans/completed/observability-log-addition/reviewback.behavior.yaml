issues:
  - id: "behavior-001"
    level: "major"
    title: "completed runtime event の malformed payload が accepted になる"
    problem: "前回問題は解決済みである。completed runtime event は payload が object でない場合と、有効な page / summary を持たない object の場合に dropped log を出し、onImportCompleted を呼ばない。"
    reason: "malformed completed payload を accepted として扱わないため、store を誤って完了状態へ更新する経路は閉じている。"
    violated_condition: "frontend runtime event log は payload parse 失敗または invalid payload を dropped として分類し、画面状態を壊さない。"
    cause_candidate: "修正前は completed 分岐が payload shape を十分に確認していなかった。修正後は frontend/src/controller/runtime/master-dictionary/master-dictionary-runtime-event-adapter.ts:277 で isRuntimeImportCompletedPayload に失敗した payload を dropped として return する。"
    evidence:
      - path: "frontend/src/controller/runtime/master-dictionary/master-dictionary-runtime-event-adapter.ts"
        line: 264
        excerpt: "handleImportCompletedEvent は非 object payload を dropped / payload_parse_failed として return する。"
      - path: "frontend/src/controller/runtime/master-dictionary/master-dictionary-runtime-event-adapter.ts"
        line: 277
        excerpt: "有効な completed payload でない object は dropped / invalid_payload として return する。"
      - path: "frontend/src/controller/runtime/master-dictionary/master-dictionary-runtime-event-adapter.test.ts"
        line: 354
        excerpt: "非 object completed payload は dropped になり、onImportCompleted を呼ばない。"
      - path: "frontend/src/controller/runtime/master-dictionary/master-dictionary-runtime-event-adapter.test.ts"
        line: 381
        excerpt: "空 object completed payload は dropped になり、onImportCompleted を呼ばない。"
    local_fix_assessment: "resolved。runtime event adapter と対応テストの局所修正で閉じている。"
    additional_check_scope: "none。frontend-local pass 証跡と malformed payload テストで主要経路は確認できる。"
    fix_considerations: "解決済みのため追加修正指示はない。frontend log を backend へ送らない条件は維持されている。"
    verification: "呼び出し元の python3 scripts/harness/run.py --suite frontend-local は pass。対象テストは malformed completed payload の dropped と handler 未呼び出しを検査している。"
    fix_required: true
    status: "resolved"

  - id: "behavior-002"
    level: "major"
    title: "phase state log の許可経路で before_state が変更前状態にならない"
    problem: "前回問題は解決済みである。phase start / pause / resume / retry / cancel の許可経路では、service が実変更前状態と実変更後状態を command read model に詰め、usecase log が before_state / after_state として出す。"
    reason: "承認済み範囲が求める変更前状態と変更後状態が、固定前提値や unknown ではなく service が判断した実状態から渡るため、状態変更前後の原因分離に使える。"
    violated_condition: "backend state transition log は、許可された状態変更で変更前状態、変更後状態、代表 id を含む。"
    cause_candidate: "修正前は service 後の PhaseState だけが log 入力に渡っていた。修正後は internal/service/*_phase_service.go の command read model が BeforePhaseState / AfterPhaseState を持ち、internal/usecase/*_phase_usecase.go が両値を logPhaseStateCommand へ渡す。"
    evidence:
      - path: "internal/usecase/translation_job_management_usecase.go"
        line: 140
        excerpt: "logPhaseStateCommand は actualBeforeState と actualAfterState を正規化し、before_state と after_state に使う。"
      - path: "internal/service/term_translation_phase_service.go"
        line: 525
        excerpt: "term phase は execution plan の BeforePhaseState を成功 response へ渡す。"
      - path: "internal/service/persona_generation_phase_service.go"
        line: 723
        excerpt: "persona phase の mutatePhaseState は更新前 run.State と更新後 state を返す。"
      - path: "internal/service/body_translation_phase_service.go"
        line: 1340
        excerpt: "body phase は状態遷移前に beforePhaseState を取得し、更新後 response に組み合わせる。"
      - path: "internal/usecase/translation_job_management_usecase_test.go"
        line: 114
        excerpt: "許可経路で before_state=idle_ready、after_state=running を検査している。"
    local_fix_assessment: "resolved。service read model と usecase log 入力の連携修正で閉じている。実状態を取れない service error だけ unknown へ戻す挙動もテストされている。"
    additional_check_scope: "none。term / persona / body の service read model と usecase 呼び出しの主要経路を確認した。API 経由の網羅確認は未実施だが、呼び出し元の backend-local pass 証跡がある。"
    fix_considerations: "解決済みのため追加修正指示はない。固定前提値に戻さず、service が取得した実状態を log payload に流す条件を維持する必要がある。"
    verification: "呼び出し元の go test ./internal/usecase、go test ./internal/service、python3 scripts/harness/run.py --suite backend-local は pass。対象テストは許可経路の actual before / after と service error 時の unknown fallback を検査している。"
    fix_required: true
    status: "resolved"
