issues:
  - id: "state-invariant-001"
    level: "major"
    title: "fake mode の model list source token が保存済み credentialRef と空 credentialRef で不一致になる"
    problem: "解決済み。provider settings 経由で model list を取得する場合、test-safe loader の時だけ source token の credentialRef を空へ正規化するようになった。validation 時も provider settings 解決結果で credentialRef が空へ正規化されるため、保存済み credentialRef がある通常 provider でも fake mode の fake-model 選択は model_selection_stale にならない。"
    reason: "fake mode の list 時点と validation 時点で credentialRef の正規形が一致する。通常 provider mode では test-safe 判定が false のため、保存済み credentialRef を使った stale 判定が維持される。"
    violated_condition: "なし。修正後は、fake mode では user-facing provider ID を通常 provider のまま維持し、credential missing と model selection stale を誤判定しない不変条件を満たしている。"
    cause_candidate: "解決前の原因候補は、provider settings 経由 source token では保存済み credentialRef を使い、fake mode の validation では credentialRef を空へ正規化していたこと。修正後は internal/service/translation_job_setup_service.go:579 で test-safe loader の場合に source token 側の credentialRef も空へ正規化される。"
    evidence:
      - path: "internal/service/translation_job_setup_service.go"
        line: 578
        excerpt: "provider settings 経由 source token は summary.CredentialReferenceID を読み取る。"
      - path: "internal/service/translation_job_setup_service.go"
        line: 579
        excerpt: "test-safe loader の場合、credentialRef を空文字へ正規化する。"
      - path: "internal/service/translation_job_setup_service.go"
        line: 597
        excerpt: "provider settings 応答後も、同じ正規化済み credentialRef で source token を再生成する。"
      - path: "internal/service/provider_settings_service.go"
        line: 878
        excerpt: "test-safe loader では ResolveProviderExecutionSettings が CredentialReferenceID を nil にし、CredentialState を not_required にする。"
      - path: "internal/service/translation_job_setup_service.go"
        line: 1024
        excerpt: "validation は ModelListSourceToken が phase、provider、credentialRef の prefix で始まることを要求する。"
      - path: "internal/service/translation_job_setup_service.go"
        line: 1591
        excerpt: "通常 provider mode では providerModelListRequestsAreTestSafe が false になり、credentialRef を使う stale 判定が残る。"
      - path: "docs/exec-plans/active/2026-05-07-fake-fixed-model-closed-path/implementation-followup-result.md"
        line: 18
        excerpt: "go test、backend-local、frontend-local が通過した。"
    local_fix_assessment: "local。translation_job_setup_service.go の source token 正規化だけで、provider settings 解決結果との不一致は閉じている。"
    additional_check_scope: "追加の必須確認なし。残留する実画面確認は状態・データ不変条件ではなく UI 反映確認に属する。"
    fix_considerations: "修正済み。今後の変更では、fake mode の source token と validation の credentialRef 正規形を同じ値に保ち、通常 provider mode の credentialRef を使った stale 検知を維持する必要がある。"
    verification: "受領済み証跡では、go test ./internal/service ./internal/infra/ai ./internal/bootstrap ./internal/controller/wails、python3 scripts/harness/run.py --suite backend-local、python3 scripts/harness/run.py --suite frontend-local が通過している。"
    fix_required: true
    status: "resolved"
