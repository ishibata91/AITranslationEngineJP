invariant_test_viewpoints:
  - DTO、frontend contract、Wails DTO に apiKey、token、authorizationHeader、rawPrompt、providerRawRequest、providerRawResponse field が追加されないこと。
  - credential_ref は UI / DTO / read model 用の参照値であり、provider auth secret は backend provider client の直前だけで解決されること。
  - provider failure、invalid response、protection validation failure、save failure の error summary は redacted reason だけを返すこと。
  - translated text は Svelte text binding で表示し、raw HTML として描画しないこと。
  - repository SQL は jobId、phaseRunID、field ID、translated text を bind し、文字列連結で組み立てないこと。

