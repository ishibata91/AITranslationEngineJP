    risk: vendor 側の実応答文言やエラー本文の運用差分は残るが、service は provider error を redacted public reason に丸めるため public leak risk は低い。
  - target: runtime structured log and console output
    reason: 広い harness 再実行と UI 実機操作は行わず、呼び出し元の system test 5 件 pass とコード検索を根拠にした。
    risk: 将来 debug log や console 出力を追加する差分では、raw prompt と provider raw payload の表示先を再レビューする必要がある。
  - target: authn / authz / tenant isolation for multi-user deployment
    reason: この desktop Wails app の実装差分には user、role、tenant 境界が新設されていない。
    risk: 将来 multi-user / tenant 化する場合、jobId だけで参照する Wails seam は別途認可境界を追加する必要がある。

