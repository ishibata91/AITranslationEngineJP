issues:
  - id: CONTRACT-BTP-001
    level: major
    title: Wails / frontend DTO が body phase summary contract を lossless に公開していない
    problem: >
      前回は backend usecase の `SkippedReasons`、`RequestSummary`、`OutputCount` が
      Wails DTO と frontend gateway contract に存在しなかった。
      現在は Wails DTO、mapper、frontend gateway contract、gateway DTO alias が該当 field を表現できる。
    reason: >
      Wails controller は `BodyTranslationPhaseInputSummaryDTO.SkippedReasons`、
      `BodyTranslationPhaseRequestSummaryDTO`、`BodyTranslationPhaseFieldResultSummaryDTO.OutputCount` を持つ。
      frontend gateway contract も同じ field と field result list を表現できるため、
      前回の DTO shape 欠落は解消済みである。
    violated_condition: >
      `GetBodyTranslationPhaseSummary` と command response は input summary、field result summary、
      request unit count、output count、error kind を保ち、Wails / frontend DTO へ lossless に写像される。
    cause_candidate: >
      前回時点では Wails / frontend contract が UI 表示用の縮約 field だけを型として固定していた可能性がある。
      現在は DTO shape と mapper が usecase contract に追従している。
    evidence:
      - path: internal/controller/wails/body_translation_phase_controller.go
        line: 77
        excerpt: BodyTranslationPhaseInputSummaryDTO は SkippedReasons を持つ。
      - path: internal/controller/wails/body_translation_phase_controller.go
        line: 87
        excerpt: BodyTranslationPhaseRequestSummaryDTO は provider target、exact exclusion、partial constraint count を持つ。
      - path: internal/controller/wails/body_translation_phase_controller.go
        line: 104
        excerpt: BodyTranslationPhaseFieldResultSummaryDTO は OutputCount を持つ。
      - path: internal/controller/wails/body_translation_phase_controller.go
        line: 402
        excerpt: toBodyTranslationPhaseInputSummaryDTO は SkippedReasons を clone して返す。
      - path: internal/controller/wails/body_translation_phase_controller.go
        line: 416
        excerpt: toBodyTranslationPhaseRequestSummaryDTO は RequestSummary の全 field を写像する。
      - path: internal/controller/wails/body_translation_phase_controller.go
        line: 439
        excerpt: toOptionalBodyTranslationPhaseFieldResultSummaryDTO は OutputCount を写像する。
      - path: frontend/src/application/gateway-contract/body-translation-phase/body-translation-phase-gateway-contract.ts
        line: 56
        excerpt: frontend gateway contract は skippedReasons を表現できる。
      - path: frontend/src/application/gateway-contract/body-translation-phase/body-translation-phase-gateway-contract.ts
        line: 66
        excerpt: frontend gateway contract は request summary を表現できる。
      - path: frontend/src/application/gateway-contract/body-translation-phase/body-translation-phase-gateway-contract.ts
        line: 103
        excerpt: frontend gateway contract は outputCount と fieldResults を表現できる。
    local_fix_assessment: resolved_by_local_dto_mapping
    additional_check_scope: none。DTO shape 欠落は現コードで解消済みである。
    fix_considerations: >
      既存 field 名と nullability を変えず、secret、API key、raw prompt、
      provider raw request / response を表現できない状態を維持する。
    verification: >
      `plan.md` の証跡では `go test ./internal/controller/wails ./internal/service -run 'BodyTranslation|FieldResult|InputSnapshot|CommandSeams'`、
      `npm --prefix frontend run test -- --run body-translation-phase`、
      `python3 scripts/harness/run.py --suite all` が pass している。
    fix_required: true
    status: resolved

  - id: CONTRACT-BTP-002
    level: major
    title: CancelBodyTranslationPhase の拒否 payload が Wails DTO として frontend へ届く
    problem: >
      前回は Go usecase と Wails controller が cancel 拒否時に redacted command payload と error を同時に返し、
      Wails error boundary で result が失われる可能性があった。
      現在の Wails controller は ErrorSummary 付き command result を nil error で返すため、
      Wails error 応答に依存せず redacted DTO が frontend gateway / usecase へ届く。
    reason: >
      implementation-scope は Wails controller が backend usecase の summary / command DTO を
      frontend gateway DTO へ lossless に写像することを completion signal にしている。
      `bodyTranslationCommandResponseOrError` は `result.ErrorSummary != nil` の時に error を返さず、
      frontend usecase は command success path で error summary、retryable flag、phase state、
      output readiness、field result list を state に反映する。
    violated_condition: >
      `CancelBodyTranslationPhase` は Paused の body phase run だけを cancel し、
      拒否時も public error kind、retryable flag、phase state、output readiness、
      redacted error summary を frontend gateway DTO へ lossless に渡す。
    cause_candidate: >
      前回の原因候補は business rejection を Go `error` として Wails boundary に返す設計だった。
      現在は Wails controller で business rejection を DTO success response に変換するため、
      原因候補は解消済みである。
    evidence:
      - path: internal/service/body_translation_phase_service.go
        line: 463
        excerpt: CancelPhase は Paused から Canceled への transition と拒否 error summary factory を使う。
      - path: internal/service/body_translation_phase_service.go
        line: 976
        excerpt: transitionBodyTranslationRunState は拒否時に ErrorSummary 付き command payload を作る。
      - path: internal/usecase/body_translation_phase_usecase.go
        line: 94
        excerpt: usecase CancelBodyTranslationPhase は command result を作ってから error を返す。
      - path: internal/controller/wails/body_translation_phase_controller.go
        line: 334
        excerpt: bodyTranslationCommandResponseOrError は ErrorSummary 付き result を nil error で返す。
      - path: frontend/src/controller/wails/body-translation-phase.gateway.ts
        line: 130
        excerpt: frontend gateway の cancel は Wails binding Promise をそのまま返す。
      - path: frontend/src/application/usecase/body-translation-phase/body-translation-phase.usecase.ts
        line: 335
        excerpt: command success path は DTO payload を summary / readiness に反映する。
      - path: frontend/src/application/usecase/body-translation-phase/body-translation-phase.usecase.ts
        line: 71
        excerpt: patchSummaryFromCommand は errorSummary と fieldResults を frontend summary に写像する。
      - path: internal/controller/wails/body_translation_phase_controller_unit_test.go
        line: 275
        excerpt: command business rejection は payload without error として固定されている。
      - path: internal/apitest/body_translation_recovery_terminal_readiness_test.go
        line: 166
        excerpt: Running cancel rejection は Wails error なしの redacted DTO として検証されている。
      - path: docs/exec-plans/completed/body-translation-phase/implementation-scope.md
        line: 421
        excerpt: integration completion signal は command DTO の frontend gateway DTO への lossless mapping を要求している。
    local_fix_assessment: resolved_by_wails_command_dto_contract
    additional_check_scope: none。Start / Pause / Resume / Retry / Cancel は同じ `bodyTranslationCommandResponseOrError` を通る。
    fix_considerations: >
      caller が分岐する business rejection は、Wails error 文字列だけに依存しない。
      DTO として渡す場合は secret、API key、raw prompt、provider raw request / response を含めない。
    verification: >
      呼び出し元提供証跡では `go test ./internal/service ./internal/usecase ./internal/controller/wails ./internal/apitest -run 'BodyTranslation|SCN_BTP'`、
      `npm --prefix frontend run test -- --run body-translation-phase`、
      `python3 scripts/harness/run.py --suite all` が pass している。
    fix_required: true
    status: resolved

