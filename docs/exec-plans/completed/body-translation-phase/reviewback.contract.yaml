residual_risks:
  - >
    frontend TypeScript contract では `requestSummary` と `resultSummary.outputCount` が optional である。
    現 Go DTO は non-pointer / non-omitempty で返すため今回の summary field 欠落は解消済みと判定したが、
    生成 binding や mock が optional 扱いを広げる余地は低リスクとして残る。
  - >
    Wails generated JavaScript binding は未確認である。
    ただし Wails controller が ErrorSummary 付き command rejection を nil error で返すため、
    Wails error 応答で payload が欠落するリスクは低い。
  - >
    contract 指摘は DTO shape、Wails command payload 互換性、provider 経路、input snapshot drift に限定した。
    cancel の状態遷移正しさや late response の永続化防止は状態・データ不変条件観点の対象である。

