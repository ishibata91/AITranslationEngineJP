      前回は terminal job、Completed run、Canceled run、late response で field result や phase state を後書きできた。
      現在は保存前に late response と terminal state を拒否する。
    reason: >
      `loadBodyTranslationRunForMutation` と `PersistBodyTranslationFieldResults` は保存処理の前に
      `bodyTranslationLateResponseRejection` を確認する。
      Start も terminal job では phase run を作成しない。
    violated_condition: >
      terminal job と Canceled / Completed body run では、field save、readiness update、late response 後書きを拒否する。
    cause_candidate: >
      前回不足していた mutation 前 guard は `bodyTranslationLateResponseRejection` と start rejection に分離された。
    evidence:
      - path: "internal/service/body_translation_field_result.go"
        line: 92
