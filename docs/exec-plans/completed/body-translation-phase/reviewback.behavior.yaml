      - path: "internal/service/body_translation_phase_service.go"
        line: 594
        excerpt: "startRejection は terminal job を terminal_job として開始拒否する。"
    local_fix_assessment: "resolved。保存入口の guard と start guard で後書き拒否が閉じている。"
    additional_check_scope: "なし。"
    fix_considerations: "late response 拒否時も既存成功済み field result は保持し、terminal state と readiness を変化させない。"
    verification: "second-review-fix 後の `go test ./internal/service ./internal/usecase ./internal/controller/wails ./internal/apitest -run 'BodyTranslation|SCN_BTP'` は pass。"
    fix_required: true
