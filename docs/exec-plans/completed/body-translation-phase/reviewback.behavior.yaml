    level: blocker
    title: "pause、resume、retry、cancel の永続状態更新は解消済み"
    problem: >
      前回は pause、resume、retry、cancel が response payload だけを返し、`JOB_PHASE_RUN` と job state を更新していなかった。
      現在は state transition transaction が run / job を更新し、retry は同じ phase run で provider 実行へ進む。
    reason: >
      `persistBodyTranslationRunStateTransition` は run と job を同一 transaction で更新する。
      API シナリオは retry の同一 phase run 継続、Paused cancel、Running cancel 拒否を確認している。
    violated_condition: >
      `PauseBodyTranslationPhase`、`ResumeBodyTranslationPhase`、`RetryBodyTranslationPhase`、
      `CancelBodyTranslationPhase` は同じ body phase run の状態と payload を一致させる。
    cause_candidate: >
      前回原因だった payload-only command は state transition helper と retry orchestration に置き換え済みである。
    evidence:
      - path: "internal/service/body_translation_phase_service.go"
        line: 1006
        excerpt: "persistBodyTranslationRunStateTransition は run / job update を transaction で実行する。"
      - path: "internal/service/body_translation_phase_service.go"
