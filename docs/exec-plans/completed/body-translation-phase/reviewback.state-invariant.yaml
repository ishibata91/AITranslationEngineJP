    problem: "前回問題。command response だけが state を差し替え、JOB_PHASE_RUN.state が更新されなかった。"
    reason: "修正後は command が transition helper を通り、JOB_PHASE_RUN と TRANSLATION_JOB を transaction 内で更新する。"
    violated_condition: "pause、resume、retry、cancel の状態遷移は同じ JOB_PHASE_RUN に永続化され、command response と次回 summary が同じ state を観測できること。"
    cause_candidate: "前回原因の stubbedExistingRunCommand 経路は、現差分では transitionBodyTranslationRunState / persistBodyTranslationRunStateTransition 経路へ置換されている。"
    evidence:
      - path: "internal/service/body_translation_phase_service.go"
        line: 976
        excerpt: "transitionBodyTranslationRunState は persistBodyTranslationRunStateTransition を呼ぶ。"
      - path: "internal/service/body_translation_phase_service.go"
        line: 1006
        excerpt: "persistBodyTranslationRunStateTransition は transaction 内で JOB_PHASE_RUN と TRANSLATION_JOB を更新する。"
    local_fix_assessment: "resolved-local-service-mutation"
    additional_check_scope: "継続監視として command 後の再読込 summary 一致を focused test で維持する。"
    fix_considerations: "同じ phase run ID と terminal state の後書き拒否を維持する。"
    verification: "plan.md の second-review-fix 証跡では all suite が pass。レビュー agent は再実行していない。"
    fix_required: true
    status: "resolved"

