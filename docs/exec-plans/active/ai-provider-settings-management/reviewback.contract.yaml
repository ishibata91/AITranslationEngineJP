assessment:
  compatibility: >
    no_issue: provider-settings-secret-read-control-review-fix 後も、
    APIキー状態の公開契約は、DB の credential_reference_id と
    credential_state を正とする形で維持されている。
    ListProviderSettings / Wails response / frontend read model は secret 本体を持たず、
    endpoint、credential reference、credential state、validation state だけを返す。
    SaveProviderSettings は credentialInput を input command の一時値としてだけ受け取り、
    APIキー入力なし保存では既存 credential reference と credential state を維持する。
    Job Setup の表示用 credential refs は provider settings 読み取り失敗時も
    legacy secret store 読み出しへ fallback せず、参照状態だけで閉じている。
    SaveProviderSettings、ResetProviderSettings、実行開始 secret snapshot は
    provider 単位 lock 配下へ寄せられている。
    secret store の Load は接続確認、モデル一覧取得、翻訳実行開始、
    マスターペルソナ生成開始の許可操作に閉じている。
  evidence_sufficiency: >
