    Wails controller / frontend gateway contract、Job Setup 表示経路、
    参照側 consumer 経路、provider 単位 lock、keyring / cache 境界、
    関連テスト、呼び出し元提供の検証証跡を確認した。
    広い harness 再実行は review_contract の責務外であり、実行していない。
