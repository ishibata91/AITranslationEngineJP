issues:
  - id: "responsibility-boundary-001"
    level: "major"
    title: "Job Setup 表示用 read model 生成が secret 解決 fallback を持つ"
    problem: "解決済み。TranslationJobSetupService.currentOptionsReadModel は表示用 options を組み立てる途中で translationJobSetupCredentialRefs を呼ぶが、translationJobSetupCredentialRefs は provider settings 読み取り失敗時に legacy secret store fallback へ進まない。fallback は user-facing provider の default credential state だけを返す。"
    reason: "summary / read model 生成は参照値だけを扱う責務である。再修正後は provider settings summary 取得成功時だけ credential reference / state を表示用値へ写し、取得失敗時も secretStore.Load を呼ばないため、summary 生成責務と secret 解決責務の混在は解消している。"
    violated_condition: "画面表示、provider 選択、endpoint 保存、APIキー入力なし保存、summary 生成では secret store の読み出しを行わない。secret 解決責務は backend service / repository secret store / infra AI provider 境界の明示操作に閉じる。"
    cause_candidate: "修正前の原因候補は、internal/service/translation_job_setup_service.go の translationJobSetupCredentialRefs が providerSettingsSummaryMap の error 後に legacy credential refs fallback で loadCredentialSecret を呼んだことである。再修正後は同じ fallback が secret store を読まない default state 生成に置き換わった。"
    evidence:
      - path: "docs/exec-plans/active/ai-provider-settings-management/implementation-scope.md"
        line: 294
        excerpt: "forbidden_read_operations に summary 生成が含まれる。"
      - path: "internal/service/translation_job_setup_service.go"
        line: 953
        excerpt: "currentOptionsReadModel が CredentialRefs に service.translationJobSetupCredentialRefs(ctx) を使う。"
      - path: "internal/service/translation_job_setup_service.go"
        line: 1095
        excerpt: "providerSettings が存在する場合、providerSettingsSummaryMap 成功時だけ summary の credential state を使う。"
      - path: "internal/service/translation_job_setup_service.go"
        line: 1121
        excerpt: "summary 取得失敗時の fallback は default credential state を返し、secret store Load を呼ばない。"
      - path: "internal/service/translation_job_setup_service.go"
        line: 1134
        excerpt: "loadCredentialSecret は残るが、translationJobSetupCredentialRefs からの呼び出しは消えている。"
      - path: "internal/service/provider_settings_service.go"
        line: 674
        excerpt: "AllowSecretSnapshot=true の ResolveProviderExecutionSettings だけ provider 単位 lock 配下で実行される。"
    local_fix_assessment: "local"
    additional_check_scope: "追加確認不要。provider settings reader が error を返す ReadOptions 経路は静的確認で secret store Load へ到達しない。広い harness は呼び出し元の pass 証跡を入力として扱った。"
    fix_considerations: "解決済み。表示用 read model 生成は secret 非依存の credential state だけを扱う状態になった。今後 provider settings 読み取り失敗を secret store 読み出しで補完すると、参照側 summary と secret 解決の責務が再結合する。"
    verification: "呼び出し元証跡として backend 対象 Go test 2 本、backend-local、frontend-local、git diff --check が pass。レビューでは translationJobSetupCredentialRefs の fallback と provider settings lock 経路を静的確認した。"
    fix_required: true
    status: "resolved"
