issues:
  - id: "state-invariant-001"
    level: "critical"
    title: "実行開始 snapshot が provider settings 更新と atomic ではない"
    problem: "再判定では解消済み。実行開始時の secret snapshot 作成は AllowSecretSnapshot=true の場合に provider 単位 lock へ入り、同じ lock 内で current summary 取得、source secret Load、snapshot Save を実行する。Save / Reset / Validate / ListProviderModels も同じ provider 単位 lock を使う。"
    reason: "Save / Reset と実行開始 snapshot が同じ provider id の mutex を共有するため、endpoint と secret が別 revision から混ざる interleaving は静的に成立しない。AllowSecretSnapshot=false の Job Setup 表示・検証補助経路は secret snapshot を作らず、secret 本体を読まない。"
    violated_condition: "前回破れた条件は、実行開始 snapshot が endpoint、credential reference、credential state、secret を同一 provider settings revision から取得することである。現在は provider 単位 lock により維持されている。"
    cause_candidate: "前回原因だった ResolveProviderExecutionSettings の lock 不参加は解消済みである。現在の ResolveProviderExecutionSettings は AllowSecretSnapshot=true のとき withProviderSettingsMutationLock を通して resolve と snapshotExecutionSecret を実行する。"
    evidence:
      - path: "internal/service/provider_settings_service.go"
        line: 656
        excerpt: "AllowSecretSnapshot かつ credential configured の場合だけ snapshotExecutionSecret を呼ぶ。"
      - path: "internal/service/provider_settings_service.go"
        line: 670
        excerpt: "AllowSecretSnapshot=false の場合は secret snapshot を作らず resolve だけを返す。"
      - path: "internal/service/provider_settings_service.go"
        line: 674
        excerpt: "AllowSecretSnapshot=true の場合は withProviderSettingsMutationLock 内で resolve を実行する。"
      - path: "internal/service/provider_settings_service.go"
        line: 703
        excerpt: "snapshotExecutionSecret は source secret を Load して snapshot ref へ Save する。"
      - path: "internal/service/provider_settings_service.go"
        line: 735
        excerpt: "withProviderSettingsMutationLock は provider id ごとの mutex で mutation を直列化する。"
      - path: "internal/service/term_translation_phase_service.go"
        line: 720
        excerpt: "用語翻訳 phase 開始は AllowSecretSnapshot=true で provider settings を解決する。"
      - path: "internal/service/master_persona_service.go"
        line: 791
        excerpt: "マスターペルソナ生成は allowSecretRead に応じて AllowSecretSnapshot を渡す。"
    local_fix_assessment: "resolved。provider settings service の局所修正で主要原因は閉じている。呼び出し側は既存の AllowSecretSnapshot=true 経路を通るため追加の cross-layer 修正は不要と判定した。"
    additional_check_scope: "将来、provider settings row または canonical secret を更新する新経路を追加する場合は、同じ provider 単位 lock に参加することを確認する。"
    fix_considerations: "表示、provider 選択、endpoint 保存、summary 生成では secret store を読まない条件を維持する必要がある。"
    verification: "呼び出し元の backend 対象 Go test 2 本、backend-local、frontend-local、git diff --check の pass 証跡を入力として扱った。静的確認では Save / Reset / Resolve の lock 共有を確認した。"
    fix_required: true
    status: "resolved"
  - id: "state-invariant-002"
    level: "critical"
    title: "Save / Reset の DB 失敗時に secret store だけが変更される"
    problem: "再判定では解消済み。Save は staged secret を先に作るが、canonical secret は DB upsert 成功後にだけ更新する。DB upsert が失敗した場合、canonical secret と row は保存前状態のままである。Reset は row 更新後に secret を削除し、secret 削除失敗時は保存前 row へ rollback する。"
    reason: "Save の DB 失敗経路では secretStageKey の cleanup だけが走り、providerSettingsSecretKey は更新されない。canonical secret 反映失敗時と reset secret 削除失敗時は restoreProviderSettingsRecord が保存前 row を upsert し直すため、成功扱いにならない部分更新が row 側へ残らない。"
    violated_condition: "前回破れた条件は、secret store と DB 設定値を transaction 相当の保存単位として扱い、失敗時に DB credential 参照状態と secret store 実体の対応を壊さないことである。現在は staged secret、DB upsert 後の canonical 反映、row rollback により維持されている。"
    cause_candidate: "前回原因だった DB transaction 内で canonical secret を先に変更する順序は解消済みである。現在の SaveProviderSettings は staged secret 作成、DB upsert、canonical secret 反映の順に分離している。ResetProviderSettings は row 更新後に secret Delete を行い、Delete 失敗時に row を rollback する。"
    evidence:
      - path: "internal/service/provider_settings_service.go"
        line: 313
        excerpt: "APIキー変更時は canonical key ではなく staged key に secret を保存する。"
      - path: "internal/service/provider_settings_service.go"
        line: 317
        excerpt: "staged secret は defer で削除される。"
      - path: "internal/service/provider_settings_service.go"
        line: 323
        excerpt: "provider settings row の Upsert は DB transaction 内で実行される。"
      - path: "internal/service/provider_settings_service.go"
        line: 334
        excerpt: "canonical secret Save は DB upsert 成功後にだけ実行される。"
      - path: "internal/service/provider_settings_service.go"
        line: 336
        excerpt: "canonical secret Save 失敗時は保存前 row へ rollback する。"
      - path: "internal/service/provider_settings_service.go"
        line: 388
        excerpt: "Reset は row を未設定状態へ Upsert する DB transaction を先に実行する。"
      - path: "internal/service/provider_settings_service.go"
        line: 399
        excerpt: "Reset の secret Delete 失敗時は保存前 row へ rollback する。"
      - path: "internal/service/provider_settings_service.go"
        line: 839
        excerpt: "restoreProviderSettingsRecord は保存前 row を再 upsert する。"
    local_fix_assessment: "resolved。主原因だった provider settings service の保存順序は局所修正で閉じている。静的 key は残るが、DB 失敗前に canonical key を更新しないため前回の DB 失敗時不整合は再現しない。"
    additional_check_scope: "将来の強化として、keyring backend が Save / Delete 後に error を返す異常系まで障害注入する余地はある。現行レビューではコード順序と呼び出し元証跡から修正済みと判定した。"
    fix_considerations: "APIキー入力なし保存で既存 APIキー本文を読まない条件を維持する必要がある。Reset 成功時だけ secret 実体と cache entry が削除される条件も維持する必要がある。"
    verification: "呼び出し元の backend 対象 Go test 2 本、backend-local、frontend-local、git diff --check の pass 証跡を入力として扱った。静的確認では staged secret、canonical secret、row rollback の順序を確認した。"
    fix_required: true
    status: "resolved"
