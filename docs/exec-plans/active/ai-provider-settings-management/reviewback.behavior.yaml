issues:
  - id: "behavior-001"
    level: "major"
    title: "Job Setup 画面表示 fallback が secret store を読む"
    problem: "再レビュー時点の実コードでは、Job Setup の options 生成で provider settings の一覧取得が失敗しても、credential refs の fallback は secretStore.Load を呼ばない。"
    reason: "修正前は provider settings 読み取り失敗時に legacy credential fallback が secret store を読んで configured 判定を作る可能性があった。修正後は fallback が provider ごとの既定 credential ref と secret 非依存の missing/not_required 状態だけを返すため、画面表示の禁止読み出しは再現しない。"
    violated_condition: "画面表示、provider 選択、endpoint 保存、APIキー入力なし保存、summary 生成では secret store の読み出しを行わない。"
    cause_candidate: "修正前の原因は internal/service/translation_job_setup_service.go の translationJobSetupCredentialRefs が providerSettingsSummaryMap の error 後に loadCredentialSecret へ落ちる構造だった。修正後の同関数は error 後も loadCredentialSecret を呼ばない fallback に変わっている。"
    evidence:
      - path: "internal/service/translation_job_setup_service.go"
        line: 953
        excerpt: "currentOptionsReadModel が画面表示用 options の CredentialRefs に translationJobSetupCredentialRefs(ctx) を使う。"
      - path: "internal/service/translation_job_setup_service.go"
        line: 1095
        excerpt: "providerSettings が存在する場合は providerSettingsSummaryMap から表示用 credential state を組み立てる。"
      - path: "internal/service/translation_job_setup_service.go"
        line: 1121
        excerpt: "provider settings summary を取得できない場合も fallback は IsConfigured と IsMissingSecret の既定値だけを返す。"
      - path: "internal/service/translation_job_setup_service.go"
        line: 1134
        excerpt: "secretStore.Load は loadCredentialSecret 内に閉じており、表示用 fallback からは呼ばれていない。"
      - path: "internal/service/provider_settings_service.go"
        line: 674
        excerpt: "AllowSecretSnapshot true の実行開始解決だけ provider 単位 lock 内で snapshotExecutionSecret を呼ぶ。"
    local_fix_assessment: "local"
    additional_check_scope: "なし。provider settings reader が error を返す ReadOptions 経路と、providerSettings 未注入 fallback 経路は実コード上で secret store Load に到達しない。"
    fix_considerations: "今後の変更でも、表示用 fallback は secret 読み出しで configured 判定を補完しないことが必要である。secret store Load は接続確認、モデル一覧取得、翻訳実行開始、マスターペルソナ生成開始の許可経路に限定する。"
    verification: "implementation_implementer の backend 対象 Go test 2 本、backend-local、implement_lane の frontend-local、git diff --check が pass。review_behavior は追加 harness を実行していない。"
    fix_required: true
    status: "resolved"
