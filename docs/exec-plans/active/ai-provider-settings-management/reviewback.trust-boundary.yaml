    title: "Job Setup 表示用 read model が secret store へ fallback する"
    problem: "再判定結果は解消済みである。Job Setup の画面表示用 read model 生成で provider settings summary を取得できない場合、現在は旧 credential fallback に落ちず、static な credential reference と missing / not_required 状態だけを返す。"
    reason: "承認済み仕様では、画面表示と summary 生成で secret store を読まないことが hard gate 条件である。修正後の translationJobSetupCredentialRefs は provider settings summary を参照値として扱い、summary 取得失敗時または providerSettings 未注入時も service.loadCredentialSecret を呼ばないため、ユーザー操作なしに APIキー本文を解決する経路は残っていない。"
    violated_condition: "画面表示、provider 選択、endpoint 保存、APIキー入力なし保存、summary 生成では secret store の読み出しを行わない。trust-boundary hard gate は他観点で相殺しない。"
    cause_candidate: "旧原因は internal/service/translation_job_setup_service.go の provider settings summary error から旧 secretStore.Load 経路へ fallthrough する実装だった。現在は internal/service/translation_job_setup_service.go:1095 から 1131 が static 参照値 fallback へ変わり、internal/service/provider_settings_service.go:278、361、425、547、674 で provider 単位 lock 配下の明示操作だけが secret 解決可能になっている。"
