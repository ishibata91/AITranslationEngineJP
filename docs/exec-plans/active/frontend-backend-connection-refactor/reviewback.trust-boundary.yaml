  - "runtime shape validation は DTO の型と列挙値を確認する。文字列値の業務的妥当性、provider endpoint の安全性、翻訳本文の表示可否は、この差分の主判定外である。"
  - "system-test は sandbox 内で Wails dev ready 待ちにより中断し、sandbox 外で通過している。この reviewback は final-validation の sandbox 外通過証跡をレビュー入力として扱う。"
