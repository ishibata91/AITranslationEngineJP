issues:
  - id: "behavior-001"
    level: "major"
    title: "参照不能 job をフェーズページへ進める"
    problem: "前回は canOpenPhase=false の job でも一覧行と現在の翻訳段階へ進むボタンから phase page を開けた。修正後は presenter が canOpenPhase と openBlockedReason を view model に渡し、canOpenPhase=false の jobRunTarget を null にする。page 側も canOpenPhase=false の job では selectJob だけを行い、phase page を開かない。"
    reason: "参照不能 job は一覧で理由を見せ、フェーズページには進めないという SCN-TFN-003 の挙動に一致する。"
    violated_condition: "解決済み。SCN-TFN-003: 参照不能 job は一覧で理由を見せ、フェーズページには進めない。"
    cause_candidate: "解決済み。frontend/src/application/presenter/translation-job-management/translation-job-management.presenter.ts:271 と frontend/src/ui/screens/translation-job-management/TranslationJobManagementPage.svelte:103 により、前回原因の canOpenPhase 未伝播と無条件遷移が閉じている。"
    evidence:
      - path: "frontend/src/application/presenter/translation-job-management/translation-job-management.presenter.ts"
        line: 271
        excerpt: "detail.canOpenPhase !== false を canOpenPhase とし、false の場合は jobRunTarget を null にする。"
      - path: "frontend/src/ui/screens/translation-job-management/TranslationJobManagementPage.svelte"
        line: 103
        excerpt: "job.canOpenPhase または job.jobRunTarget がない場合は selectJob だけを行って return する。"
      - path: "frontend/src/ui/screens/translation-job-management/TranslationJobManagementPage.svelte"
        line: 248
        excerpt: "現在の翻訳段階へ進むボタンは disabled={!job.canOpenPhase} を持つ。"
      - path: "frontend/src/application/presenter/translation-job-management/translation-job-management.presenter.test.ts"
        line: 188
        excerpt: "開けない job は理由を保持し、phase page target を作らないことを確認している。"
    local_fix_assessment: "resolved。frontend の presenter、screen type、page、presenter test の局所修正で前回症状は閉じている。"
    additional_check_scope: "none。前回 finding の主要経路は実コードと presenter test で確認済み。"
    fix_considerations: "修正済み確認。開けない job でも一覧表示、理由表示、削除などの操作表示は維持されている。"
    verification: "呼び出し元証跡として python3 scripts/harness/run.py --suite frontend-local、backend-local、coverage が pass。presenter test で canOpenPhase=false の target null 化を確認している。"
    fix_required: false
    status: "resolved"

  - id: "behavior-002"
    level: "major"
    title: "hash query でフェーズページへ直接入れる"
    problem: "前回は #translation-management/job-run?jobId=... の hash query から jobRunTarget を生成し、未完了一覧選択なしに phase page へ入れた。修正後は #translation-management/job-run で始まる hash を未完了一覧へ正規化し、URL から jobRunTarget を生成しない。"
    reason: "フェーズページへの直移動は未完了 job 一覧へ戻すという REQ-TFN-004 の挙動に一致する。"
    violated_condition: "解決済み。REQ-TFN-004: フェーズページへの直移動は未完了 job 一覧へ戻す。"
    cause_candidate: "解決済み。frontend/src/ui/views/AppShell.svelte:140 の syncRouteFromHash が旧 job-run hash を未完了一覧へ正規化し、前回原因の hash query 信頼経路を削除している。"
    evidence:
      - path: "frontend/src/ui/views/AppShell.svelte"
        line: 140
        excerpt: "#translation-management/job-run で始まる hash では selectedJobRunTarget を null にし、#translation-management へ replaceState する。"
      - path: "frontend/src/ui/views/AppShell.svelte"
        line: 177
        excerpt: "openTranslationJobRun は引数または既存 state の jobRunTarget がある場合だけ job-run 表示へ進む。"
      - path: "frontend/src/ui/views/AppShell.test.ts"
        line: 139
        excerpt: "#translation-management/job-run?jobId=10&phase=本文翻訳 が #translation-management へ戻ることを確認している。"
    local_fix_assessment: "resolved。AppShell の hash 同期と AppShell test の局所修正で前回症状は閉じている。"
    additional_check_scope: "none。前回 finding の主要経路は実コードと AppShell test で確認済み。"
    fix_considerations: "修正済み確認。一覧選択後の onOpenJobRun(target) 経路は維持され、URL 文字列だけで jobId を採用しない。"
    verification: "呼び出し元証跡として python3 scripts/harness/run.py --suite frontend-local、backend-local、coverage が pass。AppShell test で旧 hash 直リンクの正規化を確認している。"
    fix_required: false
    status: "resolved"
