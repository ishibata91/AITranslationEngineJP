issues:
  - id: "responsibility-boundary-001"
    level: "minor"
    title: "provider settings service ファイルに横断 provider log helper と persona 固有変換が混在している"
    problem: "`internal/service/provider_settings_service.go` に、provider settings service 自身の処理だけでなく、term translation、translation job setup、body translation、persona generation から使われる provider 境界 log helper が置かれている。同じ場所に persona generation 固有の失敗種別変換も置かれている。"
    reason: "`docs/coding-guidelines.md` は 1 ファイルへ置く処理を同じ責務、同じ変更理由、同じ検証単位でそろえる規約にしている。現在の配置では provider settings service の変更理由と、複数 phase service の観測 log 共通処理、persona generation 固有変換の変更理由が 1 ファイルへ混在する。"
    violated_condition: "ファイル分割責務。境界処理、変換処理、複数 service slice の共通観測処理は、同じ変更理由で説明できる単位にそろえる必要がある。"
    cause_candidate: "`provider/secret 境界 log` を最初に provider settings service の近くへ追加し、その後に term translation、translation job setup、body translation、persona generation へ利用範囲を広げた可能性がある。persona generation 固有の `normalizePersonaGenerationProviderFailureKind` も、共有 helper の近くに置かれたため provider settings service ファイルへ残った可能性がある。"
    evidence:
      - path: "internal/service/provider_settings_service.go"
        line: 812
        excerpt: "logProviderBoundaryFailure は provider_settings_service.go に定義されているが、複数 service ファイルから呼ばれている。"
      - path: "internal/service/provider_settings_service.go"
        line: 826
        excerpt: "logProviderBoundarySkipped は provider_settings_service.go に定義されているが、複数 service ファイルから呼ばれている。"
      - path: "internal/service/provider_settings_service.go"
        line: 852
        excerpt: "normalizePersonaGenerationProviderFailureKind は persona generation 固有の失敗種別を扱うが、provider_settings_service.go に定義されている。"
      - path: "internal/service/persona_generation_phase_service.go"
        line: 1718
        excerpt: "persona generation service は provider_settings_service.go の persona 固有 helper を呼んでいる。"
      - path: "internal/service/term_translation_phase_service.go"
        line: 778
        excerpt: "term translation service は provider_settings_service.go の provider 境界 log helper を呼んでいる。"
      - path: "internal/service/body_translation_phase_service.go"
        line: 898
        excerpt: "body translation service は provider_settings_service.go の provider 境界 log helper を呼んでいる。"
    local_fix_assessment: "local。層や公開 API の再設計は不要であり、service package 内の責務単位整理で閉じる可能性が高い。"
    additional_check_scope: "provider 境界 log helper を使う service 群と、その helper を直接対象にした unit test。log payload の key と分類値が変わらないことを確認する。"
    fix_considerations: "log payload の `event`、`where`、`result`、`provider`、`reason` は変えない。persona generation 固有の分類規則は persona generation service の変更理由から追える場所に保つ。"
    verification: "service package の unit test と backend-local で、provider 境界 log payload と既存 service 経路が変わらないことを確認する。"
    fix_required: false
    status: "open"
