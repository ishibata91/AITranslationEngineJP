issues:
  - id: CONTRACT-TTP-001
    level: major
    title: Retry command seam の retryable failure 契約は解決済み
    problem: >
      修正前は RetryTermTranslationPhase が recoverable_failed state だけを許可条件にし、
      save_failed など retryable=false の failure も recoverable_failed として公開される経路があった。
      最新差分では retryable=false の failure は phase / job state が failed になり、
      summary と command response の retryable flag も false になる。
    reason: >
      public contract は RetryTermTranslationPhase を retryable failure の同じ phase run に限定している。
      最新差分では rejectRetryExecutionPlan、markPhaseRunFailure、
      buildTermTranslationErrorSummary、focused test が同じ契約へ揃っているため、
      frontend gateway と外部 caller が retry 可否を誤って分岐する未解決経路は見つからない。
    violated_condition:
      - implementation-scope.md:61 RetryTermTranslationPhase は retryable failure の同じ phase run で未処理 term だけを再実行する。
      - implementation-scope.md:63 public error kind は意味を区別する。
      - implementation-scope.md:85 phase state と retryable flag は controller unit test と frontend contract test で固定される。
    cause_candidate: >
      旧原因は retryability を phase run state と summary retryable flag へ分離せず、
      recoverable_failed state に集約していたこと。最新差分では retryable=false を failed state へ分離し、
      Retry 許可条件と summary retryable flag を recoverable_failed に限定している。
    evidence:
      - path: internal/service/term_translation_phase_service.go
        line: 647
        excerpt: rejectRetryExecutionPlan は run.State != recoverable_failed を retry 不可として拒否する。
      - path: internal/service/term_translation_phase_service.go
        line: 1069
        excerpt: markPhaseRunFailure は retryable=false で phase state を failed にする。
      - path: internal/service/term_translation_phase_service.go
        line: 1086
        excerpt: markPhaseRunFailure は retryable=false で job state を failed にする。
      - path: internal/service/term_translation_phase_service.go
        line: 1265
        excerpt: buildTermTranslationErrorSummary は recoverable_failed の時だけ retryable=true を返す。
      - path: internal/service/term_translation_phase_service_test.go
        line: 769
        excerpt: save_failed は failed phase state として期待されている。
      - path: internal/service/term_translation_phase_service_test.go
        line: 801
        excerpt: non-retryable failure state の Retry 結果は retryable=false として検証されている。
    local_fix_assessment: resolved_by_local_service_contract_alignment
    additional_check_scope: >
      追加必須なし。final validation input では all harness、execution、system-test、
      coverage、Sonar 指標が通過済みである。
    fix_considerations: >
      今後 public state 名を増やす場合は DTO / frontend union / UI state へ互換性影響が出る。
      現在は既存 field 名を維持したまま、recoverable_failed と retryable flag の意味が揃っている。
    verification:
      status: verified_by_input_and_code_review
      command: python3 scripts/harness/run.py --suite all
      result: All requested harness suites passed。execution、system-test、coverage が通過し、Sonar coverage 74.5%、line 75.7%、branch 64.4%、security 0、reliability 0、maintainability HIGH 0。
    resolution: >
      retryable=false failure の phase / job failed 化、Retry 拒否条件、summary retryable flag、
      focused test が同じ契約に揃ったため、CONTRACT-TTP-001 は解決済みとする。
    fix_required: true
    status: resolved

residual_risks:
