    violated_condition: "修正前に、service 層は fake、test-safe、fake-model を知らないという条件を破っていた。"
    cause_candidate: "master persona 経路だけ marker を撤去し、body/persona/term translation の service provider port に残る同種 marker と fake provider ID まで掃き切っていなかった可能性がある。修正後は該当 marker と service fake provider ID が撤去済みである。"
    evidence:
