issues:
  - id: "behavior-001"
    level: "major"
    title: "登録可能表示が fileContent 準備完了と同期していない"
    problem: "修正前は、ファイル選択直後に operationState が ready になり、fileContent の読み込み完了前でも import を開始できた。修正後は content 読み込み完了まで ready にならず、stagedImportDraft がない登録開始も backend へ送られない。"
    reason: "browser File の path が bare filename だけの場合、content なしの import は path import へ戻る。修正後は stagedSelectionVersion と stagedImportDraft により、現在選択中の content が揃った時だけ登録可能になる。"
    violated_condition: "Input Review で現在選択中の JSON file が、backend が読める同一入力として登録されること。"
    cause_candidate: "修正前原因は、ready 表示と fileContent 読み込み完了が分離していたこと。修正後は frontend/src/controller/translation-input/translation-input-screen-controller.ts:134-183 が選択世代と content 読み込み完了を揃え、line 214-225 が未準備登録を止める。"
    evidence:
      - path: "frontend/src/controller/translation-input/translation-input-screen-controller.ts"
        line: 134
        excerpt: "selectionVersion を更新し、stagedImportDraft を null に戻してから新しい読み込みを始める。"
      - path: "frontend/src/application/presenter/translation-input/translation-input.presenter.ts"
        line: 111
        excerpt: "canImport は stagedFile と operationState ready の時だけ true になる。"
      - path: "frontend/src/controller/translation-input/translation-input-screen-controller.ts"
        line: 151
        excerpt: "fileHash と fileContent を Promise.allSettled で待つ。"
      - path: "frontend/src/controller/translation-input/translation-input-screen-controller.ts"
        line: 178
        excerpt: "content 読み込み後に operationState を ready にする。"
      - path: "frontend/src/controller/translation-input/translation-input-screen-controller.ts"
        line: 216
        excerpt: "stagedImportDraft がない stagedFile は startImport で backend へ送らない。"
      - path: "docs/exec-plans/active/exploration-normal-flow-20260503/regression-test-evidence.md"
        line: 38
        excerpt: "task 内 JSON の登録状態が accepted になり、Job Setup に接続できた。"
    local_fix_assessment: "frontend-local。Input Review controller と import 可否判定で閉じた。"
    additional_check_scope: "即時クリックと連続選択の実ブラウザ再観測は未取得だが、未解決指摘としては残さない。"
    fix_considerations: "既存の絶対 path import と、browser File 由来の content import の両方を維持する必要がある。"
    verification: "frontend-local pass と、同一 fixture の browser 登録 accepted、Job Setup 接続 accepted の回帰証跡で確認済み。"
    fix_required: true
    status: "resolved"

  - id: "behavior-002"
    level: "major"
    title: "content import 後の cache 再構築が bare filename 依存のまま残る"
    problem: "修正前は、content import 後の cache 再構築が保存済み sourceFilePath の filesystem 再読込だけに依存し、bare filename 環境で source_file_missing に戻り得た。修正後は source_file_missing 時に既存 translation cache から prepared import を再構築する。"
    reason: "探索計画の区間2は入力登録と cache 再構築確認までを対象にしている。修正後の実コードは filesystem 再読込に失敗した時だけ fallback し、回帰証跡でも cache 再構築後に件数と Job Setup 接続を維持した。"
    violated_condition: "区間2で Input Review の入力登録後、cache 再構築確認まで進めること。"
    cause_candidate: "修正前原因は、RebuildInputCache が保存済み SourceFilePath の再読込だけで prepared import を作っていたこと。修正後は internal/service/translation_input_import_service.go:235-257 が source_file_missing を検出し、line 513-544 が既存 cache から prepared import を作る。"
    evidence:
      - path: "docs/exec-plans/active/exploration-normal-flow-20260503/exploration-test-plan.md"
        line: 20
        excerpt: "区間2は Input Review の入力登録と cache 再構築確認までを対象にしている。"
      - path: "docs/exec-plans/active/exploration-normal-flow-20260503/implementation-result.integration.md"
        line: 35
        excerpt: "content import 後の RebuildTranslationInputCache が bare filename 環境で失敗する可能性を残留リスクとしている。"
      - path: "docs/exec-plans/active/exploration-normal-flow-20260503/implementation-result.integration.reviewfix.md"
        line: 16
        excerpt: "source_file_missing 時に既存 translation cache から prepared import を再構築する。"
      - path: "docs/exec-plans/active/exploration-normal-flow-20260503/regression-test-evidence.md"
        line: 42
        excerpt: "cache を再構築後も error kind、record count、field count、target plugin を維持した。"
      - path: "internal/service/translation_input_import_service.go"
        line: 235
        excerpt: "prepareRebuildImport は filesystem 再読込後、source_file_missing だけ fallback へ進む。"
      - path: "internal/service/translation_input_import_service.go"
        line: 513
