assessment:
  behavior_match: "一致。fake mode の model list loader は test-safe transport に差し替わり、通常 getModels 経路で fake-model 1 件を返す。Job Setup は provider を fake にせず test-safe loader から fake-model を受け取り、credential missing 判定を回避する。マスターペルソナは fake mode かつ未保存 model の場合に user-facing provider と fake-model を返す。provider settings provider catalog と Job Setup user-facing provider 一覧には fake が追加されていない。"
  evidence_sufficiency: "十分。指定された task 枠、軽量変更計画、実装結果、対象実コード差分を確認した。呼び出し元が提示した go test、frontend 対象テスト、backend-local、frontend-local の通過証跡をレビュー入力として扱った。レビュー agent の制約に従いハーネス再実行はしていない。"
  broken_invariants: []
  cause_candidates: []
  local_fix_assessment: "未解決の挙動正しさ指摘はない。局所修正は test-safe transport、model list loader adapter、参照側 service の条件分岐に閉じている。"
  invariant_test_viewpoints:
    - "fake mode で model list を呼ぶと provider ID が gemini、lm_studio、xai のままでも fake-model 1 件を返す。"
    - "fake mode の model list と実行時 credential 解決は外部 secret を要求しない。"
    - "fake mode の model list は外部 HTTP transport へ出ない。"
    - "AIサービス設定 provider catalog と Job Setup user-facing provider 一覧に fake を追加しない。"
    - "マスターペルソナの未保存 model は fake mode で fake-model になり、provider は user-facing provider に正規化される。"

